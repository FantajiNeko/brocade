# Brocade's vendored Xray baseline. Keep the Go module path unchanged so upstream
# packages and future protocol patches continue to use their canonical imports.

repository = "https://github.com/XTLS/Xray-core.git"
tag = "v26.4.25"
commit = "b4f08981becb71eaa995fa98ed2098ade92566bb"
imported_at = "2026-09-03"
license = "MPL-2.0"

# Brocade-maintained capabilities carried on top of this upstream baseline. The fork is the only
# Xray runtime supported by Brocade; the unpatched community binary is not a compatible deployment
# target. `sniffing_failure_routing` marks IP destinations whose bounded sniffing attempt did not
# recover a domain, allowing an explicit safe route instead of falling through to the default.
anytls = true
sniffing_failure_routing = true
secure_dokodemo_splice = true
legacy_agent_vision_splice = true
online_source_protocols = true

# Selected upstream backports; the full-tree baseline above remains unchanged.
[[backports]]
commit = "8f15190c230fe6975c9b18e31316c6bc494f3863"
pull_request = "https://github.com/XTLS/Xray-core/pull/6471"
description = "Reject truncated QUIC header-protection samples before slicing"

[[backports]]
commit = "d9c54026c5ff1652d8fc2e58ffd06706dd27a6a6"
pull_request = "https://github.com/XTLS/Xray-core/pull/6695"
description = "Sniff QUIC v2 Initial packets and recover SNI alongside v1 and draft-29"

# Outbound-only MASQUE/WARP implementation imported from the v26.10.10 tree.
# Brocade adapts it to the baseline's stream context, splice atomics, mask managers and packet
# wrapper; the netstack is isolated under proxy/masque with a bounded DNS cache. The inbound
# and later XMUX/lightweight-stack migrations are deliberately not imported. QUIC uses the
# v26.10.10 dependency version (v0.61.1-0.20260806010916-184d081eef3e).

