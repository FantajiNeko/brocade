<!doctype html>
<html lang="zh-CN" data-theme="light" data-palette="dailan">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>节点与订阅 · 三款弹窗设计</title>
  <link rel="stylesheet" href="../../src/styles.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: auto; min-height: 100%; overflow: auto; }
    body { margin: 0; font: 13px/1.5 var(--sans); color: var(--ink); background: var(--ground); }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--action); outline-offset: 3px;
    }
    .review { position: sticky; z-index: 20; top: 0; background: var(--sheet); border-bottom: 1px solid var(--line); }
    .review-top { max-width: 1400px; margin: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 24px; }
    .review-title { font-weight: 650; font-size: 14px; display: flex; align-items: center; gap: 10px; }
    .review-title small { color: var(--ink-4); font: 10px var(--mono); font-weight: 400; letter-spacing: .08em; }
    .review-seg { display: flex; padding: 3px; border-radius: 8px; background: var(--sunk); gap: 3px; }
    .review-seg button { border: 0; padding: 7px 12px; border-radius: 5px; background: transparent; color: var(--ink-3); font-size: 12px; }
    .review-seg button[aria-pressed="true"] { color: var(--action); background: var(--sheet); box-shadow: var(--sheet-shadow); font-weight: 600; }
    .review-settings { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
    .review-settings select, .review-settings button { border: 1px solid var(--line); border-radius: 6px; background: transparent; padding: 6px 10px; font-size: 12px; }
    .review-note { max-width: 1400px; margin: auto; padding: 0 24px 14px; color: var(--ink-3); font-size: 12px; }
    .review-note b { margin-right: 12px; color: var(--ink-2); font-weight: 500; }
    #mockup-stage { position: relative; inset: auto; height: auto; padding: 24px; }
    .canvas { position: relative; min-height: 830px; max-width: 1380px; margin: auto; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--ground); container-type: inline-size; }
    .stage.phone .canvas { width: min(390px, 100%); min-height: 844px; }
    .shell-top { height: 62px; padding: 18px 28px; display: flex; align-items: center; gap: 28px; border-bottom: 1px solid var(--line); background: var(--surface); color: var(--ink-3); }
    .brand { color: var(--ink); font: 22px Georgia, serif; letter-spacing: .08em; white-space: nowrap; }
    .shell-main { margin: 28px; padding: 24px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-card); }
    .shell-user { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .shell-user h2 { margin: 0; font: 650 22px var(--sans); }
    .shell-user small { color: var(--ink-4); }
    .shell-actions { display: flex; gap: 8px; margin-left: auto; }
    .shell-tabs { display: flex; gap: 56px; color: var(--ink-3); margin: 34px 0 26px; }
    .shell-tabs b { color: var(--action); font-weight: 500; }
    .shell-panel { border: 1px solid var(--line); border-radius: var(--r-card); height: 165px; margin: 18px 0; overflow: hidden; }
    .shell-panel h3 { display: flex; align-items: center; min-height: var(--panel-title-h); margin: 0; padding: 0 14px; background: var(--band); font-size: 13px; font-weight: 600; }
    .shell-reading { font-size: 28px; padding: 22px; color: var(--ink-2); }
    .overlay { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding: 46px 24px; background: var(--scrim); backdrop-filter: blur(4px); }
    .overlay[hidden] { display: none; }
    .mock-dialog { display: flex; flex-direction: column; width: min(800px, 100%); max-height: 736px; border: 1px solid var(--line); border-radius: 12px; background: var(--float-sheet); backdrop-filter: var(--float-filter); box-shadow: var(--shadow), var(--float-edge); overflow: hidden; container: mock-dialog / inline-size; }
    .mock-dialog[data-variant="b"] { width: min(940px, 100%); }
    .mock-dialog[data-variant="c"] { width: min(880px, 100%); }
    .m-head { display: flex; flex: none; align-items: center; gap: 12px; min-height: 68px; padding: 12px 22px; border-bottom: 1px solid var(--line); }
    .m-avatar { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--action); background: var(--action-wash); font: 600 12px var(--mono); flex: none; }
    .m-identity { display: flex; align-items: center; gap: 10px; }
    .m-identity b { font-size: 15px; font-weight: 650; }
    .m-identity small { color: var(--ink-4); font-size: 11px; }
    .m-tabs { display: flex; align-items: center; gap: 4px; margin-left: auto; margin-right: 18px; padding: 3px; background: var(--sunk); border-radius: 7px; }
    .m-tabs button { display: flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 14px; border: 0; border-radius: 5px; background: transparent; color: var(--ink-3); }
    .m-tabs button[aria-selected="true"] { background: var(--sheet); color: var(--action); box-shadow: var(--sheet-shadow); font-weight: 600; }
    .m-close { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 6px; color: var(--ink-4); background: transparent; }
    .m-close:hover { background: var(--hover); color: var(--ink); }
    .ic { width: 15px; height: 15px; flex: none; display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .m-content { overflow: auto; min-height: 0; overscroll-behavior: contain; }
    .m-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 13px 22px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-4); flex: none; }
    .m-foot .mono { font-size: 10px; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .muted { color: var(--ink-4); }
    .m-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 32px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: transparent; color: var(--ink-2); white-space: nowrap; font-size: 12px; }
    .m-button:hover { background: var(--hover); }
    .m-button.primary { border-color: transparent; background: var(--action-wash); color: var(--action); font-weight: 500; }
    .m-button.text { border-color: transparent; color: var(--ink-3); padding-inline: 8px; }
    .m-button.icon { width: 32px; padding: 0; }
    .m-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 18px 22px 14px; }
    .m-tools .right { display: flex; gap: 8px; margin-left: auto; }
    .m-count { display: flex; align-items: baseline; gap: 6px; color: var(--ink-3); font-size: 12px; }
    .m-count b { color: var(--ink); font-size: 19px; font-weight: 600; font-family: var(--mono); letter-spacing: -.04em; }
    .m-count small { color: var(--ink-4); margin-left: 6px; font-size: 11px; }
    .m-filter { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin: 0 22px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .m-search { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 150px; color: var(--ink-4); }
    .m-search input { min-width: 0; width: 100%; background: transparent; border: 0; height: 30px; outline-offset: 0; font-size: 12px; }
    .m-search input::placeholder { color: var(--ink-4); }
    .m-filter select, .m-sub-filter select, .m-mobile-pick { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--sheet); font-size: 12px; }
    .m-check { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); white-space: nowrap; }
    .m-check input { accent-color: var(--action); }
    .m-list { padding: 8px 22px 20px; }
    .m-columns, .m-protocol-row { display: grid; grid-template-columns: minmax(152px, 1.1fr) repeat(2, minmax(0, 1fr)); align-items: center; gap: 12px; padding-left: 26px; }
    .m-columns { min-height: 28px; font: 10px var(--mono); color: var(--ink-4); }
    .m-columns span:not(:first-child) { padding-left: 10px; }
    .m-group { margin: 4px 0 20px; }
    .m-group:last-child { margin-bottom: 0; }
    .m-group-head { display: flex; align-items: center; gap: 9px; min-height: 40px; margin-bottom: 2px; }
    .m-group-head b { font-size: 13px; font-weight: 600; }
    .m-group-head .m-button { margin-left: auto; }
    .m-flag { font-size: 15px; line-height: 1; flex: none; }
    .m-protocol-row { min-height: 42px; }
    .m-protocol-row + .m-protocol-row { position: relative; }
    .m-protocol-row + .m-protocol-row::before { position: absolute; content: ''; height: 1px; top: 0; left: 26px; right: 0; background: var(--line-soft); }
    .m-protocol { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 7px; }
    .m-protocol b { font-size: 12px; font-weight: 500; color: var(--ink-2); }
    .m-protocol small { font-size: 10px; color: var(--ink-4); }
    .m-address { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; min-height: 34px; border: 1px solid transparent; border-radius: 6px; padding: 6px 9px; color: var(--ink-2); background: transparent; text-align: left; font: 11.5px var(--mono); }
    .m-address:hover { background: var(--hover); border-color: var(--line); }
    .m-address .ic { width: 12px; height: 12px; opacity: 0; margin-left: auto; }
    .m-address:hover .ic, .m-address:focus-visible .ic { opacity: 1; }
    .m-address code { font: inherit; background: none; color: inherit; white-space: nowrap; }
    .m-dot { flex: none; width: 5px; height: 5px; border: 1px solid var(--ink-4); border-radius: 50%; }
    .m-address.passed .m-dot { background: var(--ok); border-color: var(--ok); }
    .m-address.failed { background: color-mix(in srgb, var(--err) 7%, transparent); color: var(--err); }
    .m-address.failed .m-dot { background: var(--err); border-color: var(--err); }
    .m-address.running .m-dot { background: var(--action); border-color: var(--action); }
    .m-gap { padding: 0 10px; color: var(--ink-4); font: 12px var(--mono); }
    .m-result { margin: 0 22px 10px; font-size: 11px; color: var(--ink-3); }
    .m-result summary { cursor: pointer; padding: 8px 0; }
    .m-result-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 28px; padding: 10px 0 15px; }
    .m-result-list > span { display: flex; justify-content: space-between; gap: 10px; }
    .m-result-list b { font-weight: 400; color: var(--ink-4); }
    .status-ok { color: var(--ok); }.status-bad { color: var(--err); }
    .m-browse { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 472px; min-height: 0; }
    .m-sidebar { padding: 12px; overflow: auto; background: color-mix(in srgb, var(--sunk) 65%, transparent); border-right: 1px solid var(--line); }
    .m-sidebar .m-search { padding: 0 9px 12px; }
    .m-route-pick { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 7px; padding: 12px 10px; margin-bottom: 3px; background: transparent; color: var(--ink-2); text-align: left; }
    .m-route-pick:hover { background: var(--hover); }
    .m-route-pick[aria-pressed="true"] { color: var(--action); background: var(--action-wash); }
    .m-route-pick span:last-child { min-width: 0; flex: 1; }
    .m-route-pick b { display: block; font-size: 12px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .m-route-pick small { display: block; color: var(--ink-4); font-size: 10px; margin-top: 3px; }
    .m-detail { min-width: 0; padding: 26px 26px 20px; overflow: auto; }
    .m-detail-title { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
    .m-detail-title h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .m-detail > p { color: var(--ink-4); font-size: 11px; margin: 0 0 26px 26px; }
    .m-detail-block { padding: 0 0 20px; margin-bottom: 18px; border-bottom: 1px solid var(--line-soft); }
    .m-detail-block:last-child { border-bottom: 0; }
    .m-detail-block .m-protocol { margin-bottom: 10px; }
    .m-address-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .m-detail .m-address { background: var(--sunk); min-height: 42px; }
    .m-detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .m-mobile-pick { display: none; margin: 14px 16px 0; max-width: calc(100% - 32px); }
    .m-protocol-tabs { display: flex; gap: 22px; padding: 0 22px; border-bottom: 1px solid var(--line); }
    .m-protocol-tabs button { display: flex; gap: 7px; align-items: center; border: 0; border-bottom: 2px solid transparent; padding: 12px 0; background: transparent; color: var(--ink-3); font-size: 12px; white-space: nowrap; }
    .m-protocol-tabs button[aria-pressed="true"] { color: var(--action); border-bottom-color: var(--action); font-weight: 600; }
    .m-protocol-tabs small { color: var(--ink-4); font: 10px var(--mono); }
    .m-table { padding: 0 22px 20px; }
    .m-table-head, .m-table-row { display: grid; grid-template-columns: minmax(160px, 1.15fr) 1fr 1fr 34px; align-items: center; gap: 10px; }
    .m-table-head { height: 36px; font-size: 10px; color: var(--ink-4); }
    .m-table-row { min-height: 54px; border-top: 1px solid var(--line-soft); }
    .m-route-name { display: flex; align-items: center; min-width: 0; gap: 9px; }
    .m-route-name b { font-weight: 500; font-size: 12px; }
    .m-sub-filter { display: flex; align-items: center; gap: 18px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
    .m-sub-filter label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-3); }
    .m-sub-section { padding: 26px 24px; }
    .m-sub-section + .m-sub-section { border-top: 1px solid var(--line); }
    .m-sub-heading { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
    .m-sub-icon { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink-3); flex: none; }
    .m-sub-heading h2 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
    .m-sub-heading p { color: var(--ink-4); font-size: 11px; margin: 0; }
    .m-quota { margin-left: auto; text-align: right; font-size: 10px; color: var(--ink-4); }
    .m-quota b { font: 500 15px var(--mono); color: var(--ink-2); }
    .m-quota span { display: block; margin-top: 4px; }
    .m-url { display: flex; flex-wrap: wrap; align-items: center; min-width: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--sunk); overflow: hidden; }
    .m-url code { flex: 1; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 11px var(--mono); padding: 13px 14px; color: var(--ink-2); }
    .m-url code span { color: var(--ink-4); }
    .m-url button { display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: transparent; min-height: 40px; padding: 0 12px; color: var(--ink-3); font-size: 11px; }
    .m-url button:hover { color: var(--action); background: var(--hover); }
    .m-warning { font-size: 11px; color: var(--ink-3); line-height: 1.8; margin: 12px 0 0; }
    .m-sub-status { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 11px; color: var(--ink-4); }
    .m-sub-status .m-button { margin-left: auto; }
    .m-sub-secondary { padding-top: 24px; }
    .m-limit-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
    .m-limit-bar span { color: var(--ink-4); font-size: 11px; }
    .m-limit-bar b { font: 500 20px var(--mono); }
    .m-limit-bar small { margin-left: auto; color: var(--ink-3); }
    .m-sub-cards { display: grid; grid-template-columns: 1fr 1fr; padding: 22px; gap: 20px; }
    .m-sub-cards .m-sub-section { padding: 18px; border: 1px solid var(--line); border-radius: 9px; }
    .m-sub-cards .m-url code { flex-basis: 100%; }
    .m-sub-cards .m-url button { width: 50%; border-top: 1px solid var(--line); }
    .m-empty { display: grid; justify-items: center; gap: 12px; padding: 70px 24px; color: var(--ink-4); text-align: center; }
    .m-empty > .ic { width: 30px; height: 30px; }
    .m-empty b { color: var(--ink-2); font-weight: 500; font-size: 14px; }
    .m-empty p { margin: 0; font-size: 12px; }
    .m-toast { position: absolute; z-index: 4; bottom: 22px; left: 50%; transform: translateX(-50%); border: 1px solid var(--line); border-radius: 7px; padding: 10px 16px; background: var(--sheet); box-shadow: var(--shadow); color: var(--ink-2); font-size: 12px; white-space: nowrap; }
    .m-toast[hidden] { display: none; }
    @container mock-dialog (max-width: 620px) {
      .m-head { padding: 12px 14px; min-height: 62px; gap: 8px; }
      .m-identity { gap: 8px; }.m-identity small { display: none; }
      .m-tabs { margin-right: 0; }.m-tabs button { padding: 0 10px; min-height: 36px; }
      .m-close { width: 36px; height: 36px; }
      .m-tools { padding: 15px 16px 12px; }.m-count small { margin-left: 2px; }
      .m-tools .right { margin-left: 0; }.m-button { min-height: 40px; }
      .m-filter { margin-inline: 16px; gap: 8px; }.m-filter select { min-height: 40px; }
      .m-filter .m-search { flex-basis: 100%; }.m-filter input { height: 36px; font-size: 16px; }
      .m-list { padding-inline: 16px; }.m-columns { display: none; }
      .m-group { margin-bottom: 18px; }.m-group-head { min-height: 44px; }
      .m-group-head b { font-size: 13px; }.m-group-head .m-button { font-size: 11px; }
      .m-protocol-row { grid-template-columns: 1fr 1fr; gap: 2px 6px; padding: 9px 0 9px 24px; }
      .m-protocol { grid-column: 1 / -1; }.m-address { min-height: 40px; padding: 6px; font-size: 11px; gap: 6px; }
      .m-address .ic { display: none; }
      .m-foot { padding: 12px 16px; font-size: 10px; }
      .m-result { margin-inline: 16px; }.m-result-list { grid-template-columns: 1fr; }
      .m-browse { display: block; height: auto; min-height: 0; }.m-sidebar { display: none; }
      .m-mobile-pick { display: block; width: calc(100% - 32px); min-height: 44px; font-size: 14px; }
      .m-detail { padding: 24px 18px; }.m-detail-title h2 { font-size: 17px; }
      .m-detail-block { padding-bottom: 18px; margin-bottom: 16px; }.m-detail .m-address { min-height: 46px; }
      .m-detail .m-protocol { margin-bottom: 8px; }
      .m-protocol-tabs { padding-inline: 16px; gap: 20px; overflow-x: auto; }.m-protocol-tabs button { min-height: 44px; }
      .m-table { padding-inline: 16px; }.m-table-head { display: none; }
      .m-table-row { grid-template-columns: 1fr 1fr 32px; gap: 4px; padding: 12px 0; }
      .m-table-row .m-route-name { grid-column: 1 / 3; }.m-table-row .m-button { grid-column: 3; grid-row: 1 / 3; }
      .m-table-row .m-address { grid-row: 2; }.m-table-row .m-route-name b { font-size: 13px; }
      .m-sub-filter { padding: 16px; gap: 12px; }.m-sub-filter label { flex: 1; min-width: 0; }
      .m-sub-filter select { width: 100%; min-width: 0; min-height: 40px; font-size: 16px; }
      .m-sub-filter label > span { display: none; }
      .m-sub-section { padding: 24px 18px; }.m-sub-heading { flex-wrap: wrap; gap: 10px; }
      .m-quota { flex-basis: 100%; display: flex; align-items: baseline; gap: 6px; margin: 4px 0 0 44px; text-align: left; }
      .m-quota span { margin: 0 0 0 auto; }.m-quota b { font-size: 14px; }
      .m-url code { flex-basis: 100%; padding: 14px 12px; }
      .m-url button { width: 50%; min-height: 44px; border-top: 1px solid var(--line); }
      .m-url button:last-child { border-left: 1px solid var(--line); }
      .m-sub-cards { grid-template-columns: 1fr; gap: 16px; padding: 18px 16px; }
      .m-limit-bar { padding: 16px; gap: 8px; }.m-limit-bar small { flex-basis: 100%; margin: 0; }
    }
    @container (max-width: 620px) {
      .overlay { padding: 18px 0 0; align-items: flex-end; }
      .mock-dialog { max-height: 806px; width: 100%; border-radius: 12px 12px 0 0; }
      .shell-top { gap: 16px; padding-inline: 18px; }.shell-top span:last-child { display: none; }
      .shell-main { margin: 16px; padding: 16px; }.shell-user small { display: none; }
    }
    @media (max-width: 700px) {
      .review-top { padding: 12px 14px; gap: 10px; }.review-settings { margin-left: 0; }
      .review-seg { width: 100%; }.review-seg button { flex: 1; padding-inline: 8px; }
      .review-note { padding: 0 14px 12px; }.review-note b { display: block; margin-bottom: 3px; }
      #mockup-stage { padding: 14px 8px; }.canvas { min-height: 844px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="review">
    <div class="review-top">
      <div class="review-title">节点与订阅 <small>DESIGN STUDY · 03</small></div>
      <nav class="review-seg" aria-label="设计方案">
        <button data-variant="a" aria-pressed="true">A · 原版精修</button>
        <button data-variant="b" aria-pressed="false">B · 双栏浏览</button>
        <button data-variant="c" aria-pressed="false">C · 协议视图</button>
      </nav>
      <div class="review-settings">
        <select id="scene" aria-label="预览场景"><option value="regular">常规</option><option value="done">拨测后</option><option value="long">长名称</option><option value="empty">无节点</option></select>
        <button id="device" aria-pressed="false">手机 390</button>
        <button id="theme">切换暗色</button>
      </div>
    </div>
    <p class="review-note" id="design-note"></p>
  </header>
  <main class="stage" id="mockup-stage">
    <div class="canvas">
      <div class="shell-top"><b class="brand">Brocade</b><span>机器</span><span>线路</span><span>用量</span></div>
      <div class="shell-main">
        <div class="shell-user"><span class="m-avatar">AL</span><h2>alice</h2><small>已授权 30 · 543.13 GiB</small><div class="shell-actions"><button class="m-button" data-open="nodes">节点</button><button class="m-button" data-open="subscription">订阅</button></div></div>
        <div class="shell-tabs"><b>接入</b><span>转发</span><span>统计</span></div>
        <section class="shell-panel"><h3>用量与额度</h3><div class="shell-reading">543.13 <small>GiB</small></div></section>
        <section class="shell-panel"><h3>在线设备</h3></section><section class="shell-panel"><h3>接入授权</h3></section>
      </div>
      <div class="overlay" id="overlay"><section class="mock-dialog" role="dialog" aria-modal="true" aria-label="alice 的节点与订阅" data-variant="a" id="dialog"></section></div>
      <div class="m-toast" role="status" id="toast" hidden></div>
    </div>
  </main>
  <script>
    // Independent design fixture: all addresses and states are synthetic; no application API calls.
    const paths = {
      node: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
      rss: '<path d="M5 11a8 8 0 0 1 8 8M5 4a15 15 0 0 1 15 15"/><circle cx="5" cy="19" r="1"/>',
      copy: '<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
      close: '<path d="m6 6 12 12M6 18 18 6"/>',
      search: '<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
      probe: '<path d="M3 12h4l3-7 4 14 3-7h4"/>',
      shield: '<path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8 12 3 3 5-6"/>',
      arrow: '<path d="M5 12h14m-5-5 5 5-5 5"/>',
    };
    const icon = name => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.node}</svg>`;
    const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const descriptions = {
      a: ['最接近旧版 · 推荐作为起点', '按接入点分组，协议逐行排列。保留熟悉的阅读顺序，用对齐与留白降低密度。'],
      b: ['一次专注一个接入点', '左侧快速选节点，右侧呈现连接信息。30 个接入点不会同时展开；手机改为顶部选择。'],
      c: ['优先比较同一种协议', '切换协议后，每个接入点只占一行。浏览和排查更快，跨协议比较需要切换。'],
    };
    const routeSeed = [
      ['🇭🇰','香港 01 @ CN2','APAC Premium'],['🇭🇰','香港 02 @ CN2','APAC Premium'],
      ['🇹🇼','台湾 01 @ CN2','APAC Premium'],['🇯🇵','日本 01 @ CN2','APAC Premium'],
      ['🇲🇾','大马 01 @ CN2','APAC Standard'],['🇭🇰','香港示例 01','APAC Standard'],
      ['🇲🇴','澳门示例 01','APAC Standard'],['🇯🇵','日本示例 01','APAC Standard'],
      ['🇺🇸','洛杉矶示例 01','NORAM Premium'],['🇺🇸','圣何塞示例 01','NORAM Standard'],
      ['🇩🇪','法兰克福 01 @ Demo','EMEA Premium'],['🇫🇷','巴黎 01 @ Demo','VPN Gate / Proxies'],
    ];
    const routes = Array.from({length:30}, (_, i) => ({id:i, flag:routeSeed[i%12][0], name:routeSeed[i%12][1] + (i>=12 ? ` · ${Math.floor(i/12)+1}` : ''), line:routeSeed[i%12][2], v6: i%5!==4}));
    const protocols = [{id:'vless',name:'VLESS',stack:'REALITY · TCP',port:i=>8448+i},{id:'anytls',name:'AnyTLS',stack:'TLS',port:i=>16000+i},{id:'hy2',name:'Hysteria 2',stack:'QUIC',port:i=>`${18100+i*100}-${18199+i*100}`}];
    const state = {variant:'a',tab:'nodes',scene:'regular',family:'both',protocol:'vless',route:0,search:'',encryption:false,subType:'clash',subProtocol:'all',revealed:false,koipy:true,running:false,opened:true};
    let toastTimer, probeTimer, opener;
    const $ = selector => document.querySelector(selector);
    const routeName = r => state.scene==='long' && r.id===0 ? '香港 01 @ CN2 · 高峰优化备用入口 / Premium' : r.name;
    const shown = () => state.scene==='empty' ? [] : routes.filter(r => `${routeName(r)} ${r.line}`.toLowerCase().includes(state.search.toLowerCase()));
    const selectedProtocols = () => state.encryption ? [...protocols,{id:'encryption',name:'VLESS Encryption',stack:'Encryption · TCP',port:i=>13448+i}] : protocols;
    const families = () => state.family==='both' ? [4,6] : [Number(state.family)];
    const nodeStatus = (r,p,f) => state.running ? 'running' : state.scene==='done' ? (r.id===1 && p.id==='hy2' && f===6 ? 'failed' : 'passed') : '';
    const shareUri = (r,p,f) => `${p.id==='hy2'?'hysteria2':p.id==='anytls'?'anytls':'vless'}://preview-only@${f===6?'[2001:db8::1]':'192.0.2.1'}:${p.port(r.id)}#${encodeURIComponent(routeName(r))}`;
    function address(r,p,f) {
      if((f===6 && !r.v6) || !families().includes(f)) return '<span class="m-gap" title="未提供该地址族">—</span>';
      const status=nodeStatus(r,p,f);
      const endpoint=`${f===6?'[v6]':'v4'}:${p.port(r.id)}`;
      return `<button class="m-address ${status}" data-copy="node" data-route="${r.id}" data-protocol="${p.id}" data-family="${f}" aria-label="复制 ${escapeHtml(routeName(r))} ${p.name} IPv${f}" title="${status==='failed'?'连接超时 · ':status==='passed'?'通过 · ':''}复制完整分享链接"><i class="m-dot"></i><code>${endpoint}</code>${icon('copy')}</button>`;
    }
    function searchBox() { return `<label class="m-search">${icon('search')}<input id="route-search" aria-label="搜索接入点" placeholder="搜索接入点或线路" value="${escapeHtml(state.search)}" /></label>`; }
    function results() {
      return `<details class="m-result"><summary>拨测结果${state.scene==='done'?' · 161 通过，1 失败':state.running?' · 正在验证':' · 尚未验证'}</summary><div class="m-result-list">${['APAC Premium','APAC Standard','NORAM Premium','NORAM Standard','EMEA Premium','VPN Gate / Proxies'].map((line,i)=>`<span>${line}<b class="${state.scene==='done'&&i===0?'status-bad':''}">${state.scene==='done'?(i===0?'1 项失败':'全部通过'):'—'}</b></span>`).join('')}</div></details>`;
    }
    function tools() {
      const count=shown().reduce((sum,r)=>sum+selectedProtocols().length*families().filter(f=>f!==6||r.v6).length,0);
      return `<div class="m-tools"><span class="m-count"><b>${count}</b> 个节点 <small>${state.scene==='empty'?0:30} 个接入点</small></span><div class="right"><button class="m-button text" data-copy="all" ${count?'':'disabled'}>${icon('copy')}复制全部</button><button class="m-button primary" data-probe="all" ${count?'':'disabled'}>${icon('probe')}${state.running?'取消拨测':'拨测全部'}</button></div></div>`;
    }
    function filters() { return `<div class="m-filter">${searchBox()}<select id="family" aria-label="地址族"><option value="both">双栈</option><option value="4">IPv4</option><option value="6">IPv6</option></select><label class="m-check"><input type="checkbox" id="encryption" ${state.encryption?'checked':''}/>VLESS Encryption</label></div>`; }
    function empty() { return `<div class="m-empty">${icon('node')}<b>${state.scene==='empty'?'暂无可用节点':'没有匹配的接入点'}</b><p>${state.scene==='empty'?'接入授权生效后，节点会显示在这里。':'试试地区名称，或清空搜索。'}</p></div>`; }
    function group(r) { return `<section class="m-group"><div class="m-group-head"><span class="m-flag">${r.flag}</span><b>${escapeHtml(routeName(r))}</b><button class="m-button text" data-probe="${r.id}">拨测</button></div>${selectedProtocols().map(p=>`<div class="m-protocol-row"><span class="m-protocol"><b>${p.name}</b><small>${p.stack}</small></span>${address(r,p,4)}${address(r,p,6)}</div>`).join('')}</section>`; }
    function nodesA() { return tools()+filters()+results()+`<div class="m-list">${shown().length?'<div class="m-columns"><span>协议</span><span>IPv4</span><span>IPv6</span></div>'+shown().map(group).join(''):empty()}</div>`; }
    function routePicker() { return `<select class="m-mobile-pick" id="route-picker" aria-label="选择接入点">${shown().map(r=>`<option value="${r.id}" ${r.id===state.route?'selected':''}>${r.flag} ${escapeHtml(routeName(r))}</option>`).join('')}</select>`; }
    function nodesB() {
      const list=shown(),r=list.find(r=>r.id===state.route)||list[0];
      if(!r)return tools()+filters()+empty();
      return tools()+routePicker()+`<div class="m-browse"><aside class="m-sidebar">${searchBox()}${list.map(route=>`<button class="m-route-pick" data-route-pick="${route.id}" aria-pressed="${route.id===r.id}"><span class="m-flag">${route.flag}</span><span><b>${escapeHtml(routeName(route))}</b><small>${route.line} · ${route.v6?'6':'3'} 个节点</small></span></button>`).join('')}</aside><div class="m-detail"><div class="m-detail-title"><span class="m-flag">${r.flag}</span><h2>${escapeHtml(routeName(r))}</h2></div><p>${r.line} · ${r.v6?'IPv4 / IPv6':'仅 IPv4'}</p>${selectedProtocols().map(p=>`<section class="m-detail-block"><div class="m-protocol"><b>${p.name}</b><small>${p.stack}</small></div><div class="m-address-pair">${address(r,p,4)}${address(r,p,6)}</div></section>`).join('')}<div class="m-detail-actions"><button class="m-button primary" data-probe="${r.id}">${icon('probe')}拨测此接入点</button><button class="m-button" data-copy="route" data-route="${r.id}">${icon('copy')}复制此接入点</button></div></div></div>`+results();
    }
    function nodesC() {
      const p=selectedProtocols().find(p=>p.id===state.protocol)||protocols[0];
      return tools()+`<nav class="m-protocol-tabs" aria-label="节点协议">${selectedProtocols().map(p=>`<button data-protocol-pick="${p.id}" aria-pressed="${p.id===state.protocol}">${p.name}<small>${state.scene==='empty'?0:54}</small></button>`).join('')}</nav>`+`<div style="height:14px"></div>`+filters()+results()+`<div class="m-table">${shown().length?'<div class="m-table-head"><span>接入点</span><span>IPv4</span><span>IPv6</span><span></span></div>'+shown().map(r=>`<div class="m-table-row"><span class="m-route-name"><span class="m-flag">${r.flag}</span><b>${escapeHtml(routeName(r))}</b></span>${address(r,p,4)}${address(r,p,6)}<button class="m-button text icon" data-probe="${r.id}" aria-label="拨测 ${escapeHtml(routeName(r))}" title="拨测">${icon('probe')}</button></div>`).join(''):empty()}</div>`;
    }
    const subscriptionUrl = kind => `https://tat.example/sub/v1/${kind==='koipy'?'preview-koipy-token':'preview-clash-token'}/clash.yaml${state.family==='both'?'':`?family=v${state.family}`}${state.subProtocol==='all'?'':`${state.family==='both'?'?':'&'}protocol=${state.subProtocol}`}`;
    function urlBox(kind) { return `<div class="m-url"><code title="示例订阅地址">${state.revealed?escapeHtml(subscriptionUrl(kind)):'https://tat.example/sub/v1/<span>••••••••••••</span>/clash.yaml'}</code><button data-reveal>${state.revealed?'隐藏':'显示'}</button><button data-copy="subscription" data-kind="${kind}">${icon('copy')}复制</button></div>`; }
    function quota() { return '<div class="m-quota">剩余 <b>456.87 GiB</b><span>11 月 1 日重置</span></div>'; }
    function subFilters() { return '<div class="m-sub-filter"><label><span>协议</span><select id="sub-protocol" aria-label="订阅协议"><option value="all">全部协议</option><option value="vless">VLESS</option><option value="anytls">AnyTLS</option><option value="hy2">Hysteria 2</option></select></label><label><span>地址族</span><select id="family" aria-label="地址族"><option value="both">双栈</option><option value="4">IPv4</option><option value="6">IPv6</option></select></label></div>'; }
    function subSection(kind, withQuota=false) {
      const standard=kind==='clash';
      return `<section class="m-sub-section"><div class="m-sub-heading"><span class="m-sub-icon">${icon(standard?'rss':'probe')}</span><div><h2>${standard?'Clash 订阅':'koipy 测速订阅'}</h2><p>${standard?'Mihomo / Clash Meta · SubBoost 标准版':'仅管理员 · 专用测速地址'}</p></div>${withQuota?quota():''}</div>${standard?urlBox(kind):`<div class="m-sub-status"><span class="${state.koipy?'status-ok':''}">${state.koipy?'可用':'已撤销'}</span><button class="m-button text" data-koipy>${state.koipy?'撤销地址':'重新生成'}</button></div>${state.koipy?urlBox(kind):'<p class="m-warning">旧测速地址已停用，需要时可重新生成。</p>'}<p class="m-warning">包含用户 UUID 等连接凭据，请仅交给可信的测速服务。撤销只停止此地址的后续拉取，已下载的节点配置仍然有效。</p>`}</section>`;
    }
    function subscription() {
      if(state.variant==='a')return subFilters()+subSection('clash',true)+subSection('koipy');
      if(state.variant==='b')return subFilters()+`<select class="m-mobile-pick" id="sub-picker" aria-label="订阅类型"><option value="clash">Clash 订阅</option><option value="koipy">koipy 测速订阅</option></select><div class="m-browse"><aside class="m-sidebar">${['clash','koipy'].map(kind=>`<button class="m-route-pick" data-sub-pick="${kind}" aria-pressed="${state.subType===kind}">${icon(kind==='clash'?'rss':'probe')}<span><b>${kind==='clash'?'Clash 订阅':'koipy 测速订阅'}</b><small>${kind==='clash'?'日常连接 · 多协议':'管理专用 · 测速'}</small></span></button>`).join('')}</aside><div>${subSection(state.subType,true)}<div class="m-limit-bar"><span>按当前接入授权实时生成</span><small>下次重置 · 11 月 1 日</small></div></div></div>`;
      return subFilters()+'<div class="m-limit-bar"><span>剩余流量</span><b>456.87 <small>GiB</small></b><small>11 月 1 日重置 · 14 天后</small></div>'+`<div class="m-sub-cards">${subSection('clash')}${subSection('koipy')}</div>`;
    }
    function render(restoreSearch=false) {
      const position=restoreSearch?$('#route-search')?.selectionStart:null;
      $('#dialog').dataset.variant=state.variant;
      $('#design-note').innerHTML=`<b>${descriptions[state.variant][0]}</b>${descriptions[state.variant][1]} <span class="muted">· 示例数据，仅供评审</span>`;
      document.querySelectorAll('[data-variant]').forEach(el=>{if(el.tagName==='BUTTON')el.setAttribute('aria-pressed',String(el.dataset.variant===state.variant));});
      $('#dialog').innerHTML=`<header class="m-head"><div class="m-identity"><span class="m-avatar">AL</span><b>alice</b><small>个人接入</small></div><div class="m-tabs" role="tablist" aria-label="节点与订阅">${[['subscription','订阅','rss'],['nodes','节点','node']].map(([id,label,ic])=>`<button role="tab" id="tab-${id}" aria-selected="${state.tab===id}" aria-controls="mock-panel" tabindex="${state.tab===id?0:-1}" data-tab="${id}">${icon(ic)}${label}</button>`).join('')}</div><button class="m-close" id="close" aria-label="关闭弹窗">${icon('close')}</button></header><div class="m-content" id="mock-panel" role="tabpanel" aria-labelledby="tab-${state.tab}">${state.tab==='nodes'?({a:nodesA,b:nodesB,c:nodesC}[state.variant])():subscription()}</div><footer class="m-foot"><span>${state.tab==='nodes'?'点地址复制完整链接':'节点凭据变更需发布授权并等待生效'}</span><span class="mono">${state.tab==='nodes'?(state.running?'拨测中…':state.scene==='done'?'161 通过 · 1 失败':'Serving R1936'):'按当前授权实时生成'}</span></footer>`;
      if($('#family'))$('#family').value=state.family;
      if($('#sub-protocol'))$('#sub-protocol').value=state.subProtocol;
      if($('#sub-picker'))$('#sub-picker').value=state.subType;
      if(restoreSearch&&$('#route-search')) { $('#route-search').focus(); $('#route-search').setSelectionRange(position,position); }
      $('#overlay').hidden=!state.opened;
      document.querySelectorAll('.shell-main,.shell-top').forEach(el=>el.inert=state.opened);
    }
    function toast(message) { clearTimeout(toastTimer); $('#toast').textContent=message; $('#toast').hidden=false; toastTimer=setTimeout(()=>$('#toast').hidden=true,1800); }
    async function copy(button) {
      let text='';
      if(button.dataset.copy==='subscription')text=subscriptionUrl(button.dataset.kind);
      else if(button.dataset.copy==='node') { const r=routes[Number(button.dataset.route)],p=selectedProtocols().find(p=>p.id===button.dataset.protocol); text=shareUri(r,p,Number(button.dataset.family)); }
      else { const subset=button.dataset.copy==='route'?routes.filter(r=>r.id===Number(button.dataset.route)):routes; text=subset.flatMap(r=>selectedProtocols().flatMap(p=>families().filter(f=>f!==6||r.v6).map(f=>shareUri(r,p,f)))).join('\n'); }
      try { await navigator.clipboard.writeText(text);toast('已复制示例链接'); } catch { toast('浏览器未允许复制示例链接'); }
    }
    document.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button)return;
      if(button.dataset.variant) { state.variant=button.dataset.variant; state.search=''; render(); }
      else if(button.dataset.tab) { state.tab=button.dataset.tab; state.revealed=false; render(); $(`#tab-${state.tab}`).focus(); }
      else if(button.dataset.open) { opener=button;state.tab=button.dataset.open;state.opened=true;render();$(`#tab-${state.tab}`).focus(); }
      else if(button.id==='close') { state.opened=false;render();(opener||document.querySelector(`[data-open="${state.tab}"]`)).focus(); }
      else if(button.id==='theme') { const dark=document.documentElement.dataset.theme==='light';document.documentElement.dataset.theme=dark?'dark':'light';button.textContent=dark?'切换亮色':'切换暗色'; }
      else if(button.id==='device') { const phone=$('#mockup-stage').classList.toggle('phone');button.setAttribute('aria-pressed',String(phone));button.textContent=phone?'桌面宽度':'手机 390'; }
      else if(button.dataset.routePick) { state.route=Number(button.dataset.routePick); render(); }
      else if(button.dataset.protocolPick) { state.protocol=button.dataset.protocolPick;render(); }
      else if(button.dataset.subPick) { state.subType=button.dataset.subPick;state.revealed=false;render(); }
      else if(button.hasAttribute('data-reveal')) { state.revealed=!state.revealed; render(); }
      else if(button.hasAttribute('data-koipy')) { state.koipy=!state.koipy;render();toast('仅切换示例状态'); }
      else if(button.dataset.copy) { copy(button); }
      else if(button.hasAttribute('data-probe')) { clearTimeout(probeTimer);if(state.running){state.running=false;render();return;}state.running=true;render();probeTimer=setTimeout(()=>{state.running=false;state.scene='done';$('#scene').value='done';render();},1400); }
    });
    document.addEventListener('input',event=>{if(event.target.id==='route-search'){state.search=event.target.value;render(true);}});
    document.addEventListener('change',event=>{
      const el=event.target;
      if(el.id==='scene'){state.scene=el.value;state.running=false;clearTimeout(probeTimer);}
      else if(el.id==='family'){state.family=el.value;state.revealed=false;}
      else if(el.id==='encryption'){state.encryption=el.checked;if(!el.checked&&state.protocol==='encryption')state.protocol='vless';}
      else if(el.id==='sub-protocol'){state.subProtocol=el.value;state.revealed=false;}
      else if(el.id==='route-picker')state.route=Number(el.value);
      else if(el.id==='sub-picker'){state.subType=el.value;state.revealed=false;}
      else return;render();
    });
    document.addEventListener('keydown',event=>{
      if(!state.opened)return;
      if(event.key==='Escape'){event.preventDefault();$('#close').click();}
      else if(event.target.matches('[data-tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) {event.preventDefault();state.tab=event.key==='Home'?'subscription':event.key==='End'?'nodes':state.tab==='nodes'?'subscription':'nodes';render();$(`#tab-${state.tab}`).focus();}
      else if(event.key==='Tab'&&$('#dialog').contains(document.activeElement)) {const all=[...$('#dialog').querySelectorAll('button:not(:disabled),input,select,summary')].filter(el=>el.tabIndex>=0&&el.getClientRects().length);const first=all[0],last=all.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
    });
    const hash=location.hash.slice(1).split('/');if(['a','b','c'].includes(hash[0]))state.variant=hash[0];if(hash[1]==='subscription')state.tab='subscription';
    render();
  </script>
</body>
</html>
