<!doctype html>
<html lang="zh-CN" data-theme="dark" data-palette="dailan">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>实时流量 · 改版 mockup</title>
    <!-- 直接引用生产样式：令牌、面板、标题条、分段开关、搜索框、头像与读数栏都是真实的类，
         本页只补改版新增的部分（前缀 ut-）和审阅外壳（前缀 mk-）。数据全部合成。 -->
    <link rel="stylesheet" href="../../src/styles.css" />
    <style>
      /* ── 审阅外壳：不属于设计 ── */
      html,
      body {
        height: auto;
        min-height: 100%;
        overflow: auto;
      }
      body {
        margin: 0;
        background: var(--ground);
      }
      .mk-bar {
        position: sticky;
        z-index: 20;
        top: 0;
        border-bottom: 1px solid var(--line);
        background: var(--sheet);
      }
      .mk-bar-row {
        display: flex;
        max-width: 1480px;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 22px;
        margin: 0 auto;
        padding: 12px 24px 10px;
      }
      .mk-title {
        display: flex;
        align-items: baseline;
        gap: 10px;
        color: var(--ink);
        font: 600 14px var(--sans);
        white-space: nowrap;
      }
      .mk-title small {
        color: var(--ink-4);
        font: 400 10px var(--mono);
        letter-spacing: 0.08em;
      }
      .mk-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        margin-left: auto;
      }
      .mk-ctl {
        --ctl-h: 28px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .mk-ctl[hidden] {
        display: none;
      }
      .mk-ctl-label {
        color: var(--ink-4);
        font-size: 11.5px;
      }
      .mk-ctl .segsw button {
        padding: 0 9px;
        font-size: 12px;
      }
      .mk-note {
        max-width: 1480px;
        margin: 0 auto;
        padding: 0 24px 12px;
        color: var(--ink-3);
        font-size: 12px;
        line-height: 1.6;
      }
      .mk-note b {
        margin-right: 8px;
        color: var(--ink-2);
        font-weight: 500;
      }
      .mk-stage {
        padding: 28px 24px 64px;
      }
      .mk-sheet {
        width: min(100%, calc(var(--stage-w) + 42px));
        box-sizing: border-box;
        margin: 0 auto;
        padding: 18px 20px 22px;
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        background: var(--sheet);
      }
      .mk-sheet.phone {
        width: min(100%, 390px);
        padding: 12px;
      }
      .mk-sheet > .panel {
        margin: 0;
      }

      /* ════ 改版 ════
         结构不变：标题条 + 左侧读数栏（与「用量与额度」「机器流量」同一家族）+ 右侧主区。
         变的是主区随人数换形态：1 位放大成走势图，2–3 位并排小倍图，4–24 位全部列出，
         25 位以上读数栏加人群点阵、列表默认按当前速率并折叠到与读数栏等高；
         数字每秒更新，排名变化后由用户确认重排，列表不会自己跳动。 */

      /* 单人：读数栏顶部放这个人的身份 */
      .ut-id {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 10px;
      }
      .ut-id .rut-name {
        font-size: 14px;
      }
      /* 集中度：读数栏底部的键值行 */
      .ut-facts {
        display: grid;
        gap: 6px;
        margin: 0;
        padding-top: 12px;
        border-top: 1px solid var(--line-soft);
      }
      .ut-facts > div {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .ut-facts dt {
        color: var(--ink-3);
        font-size: 12px;
      }
      .ut-facts dd {
        margin: 0;
        color: var(--ink);
        font: 500 12.5px var(--sans);
        font-variant-numeric: tabular-nums;
      }

      /* ── 人群点阵（25 位以上）：全部用户按名称固定位置，位置不随数值跳动。
         只有一种编码：实心深浅 = 当前速率（同一色相四档，开方刻度；四档已按序数色阶校验），
         空心 = 空闲。上千人时点太小，改成小方格，空闲格只留极淡的底，活跃格才显色。 */
      .ut-crowd {
        display: grid;
        gap: 9px;
        padding-top: 12px;
        border-top: 1px solid var(--line-soft);
      }
      .ut-crowd-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        color: var(--ink-3);
        font-size: 12px;
      }
      .ut-crowd-head b {
        color: var(--ink-2);
        font-weight: 500;
      }
      .ut-map {
        display: grid;
        grid-auto-rows: var(--pitch);
        grid-template-columns: repeat(auto-fill, var(--pitch));
        margin: 0 -1px;
      }
      .ut-dot {
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .ut-dot::before {
        width: 64%;
        height: 64%;
        border-radius: 50%;
        background: var(--c, transparent);
        box-shadow: var(--ring, none);
        content: '';
      }
      .ut-map.dense .ut-dot::before {
        width: calc(100% - 1px);
        height: calc(100% - 1px);
        border-radius: 1px;
      }
      .ut-dot.l1,
      .ut-key-ramp .l1 {
        --c: color-mix(in srgb, var(--observe-1) 50%, var(--card));
      }
      .ut-dot.l2,
      .ut-key-ramp .l2 {
        --c: color-mix(in srgb, var(--observe-1) 66%, var(--card));
      }
      .ut-dot.l3,
      .ut-key-ramp .l3 {
        --c: color-mix(in srgb, var(--observe-1) 82%, var(--card));
      }
      .ut-dot.l4,
      .ut-key-ramp .l4 {
        --c: var(--observe-1);
      }
      .ut-dot.idle {
        --ring: inset 0 0 0 1px color-mix(in srgb, var(--ink-4) 50%, transparent);
      }
      .ut-map.dense .ut-dot.idle {
        --ring: none;
        --c: color-mix(in srgb, var(--ink-4) 22%, transparent);
      }
      .ut-dot.unknown {
        --c: color-mix(in srgb, var(--ink-4) 32%, transparent);
      }
      /* 实时停止更新：保留上次读数的位置与大小，只把颜色降成中性 */
      .stale .ut-dot:is(.l1, .l2, .l3, .l4) {
        --c: color-mix(in srgb, var(--ink-4) 70%, var(--card));
      }
      .ut-map.searching .ut-dot:not(.match) {
        opacity: 0.22;
      }
      .ut-dot.hot::before {
        outline: 1.5px solid var(--ink);
        outline-offset: 1.5px;
      }
      .ut-key {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 6px;
        color: var(--ink-4);
        font-size: 11px;
        line-height: 14px;
      }
      .ut-key-ramp {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .ut-key-ramp i,
      .ut-key-idle {
        display: block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--c);
      }
      .ut-key-idle {
        margin-left: 8px;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink-4) 50%, transparent);
        background: none;
      }
      .ut-key.dense .ut-key-ramp i,
      .ut-key.dense .ut-key-idle {
        border-radius: 1px;
      }
      .ut-key.dense .ut-key-idle {
        box-shadow: none;
        background: color-mix(in srgb, var(--ink-4) 22%, transparent);
      }
      .ut-readout {
        min-height: 48px;
        margin: 0;
        color: var(--ink-4);
        font-size: 11.5px;
        line-height: 16px;
        font-variant-numeric: tabular-nums;
      }
      .ut-readout b {
        color: var(--ink);
        font-weight: 500;
      }
      .ut-readout .v {
        color: var(--ink-2);
      }

      /* ── 列表：一人一张小卡片，身份 │ 近 1 小时走势 │ 当前下行 / 上行。
         卡片有内边距和 8px 间隙，内容不贴边。卡面单独取值：亮色是白卡落在块档卡底上，
         暗色的卡面与块档同色，提亮 3% 才看得出卡片。重排平移时卡片互相覆盖，底色必须不透明。 */
      .ut-card {
        --ut-cell: var(--card);
      }
      :root:not([data-theme='light']) .ut-card {
        --ut-cell: color-mix(in srgb, var(--ink) 3%, var(--card));
      }
      .ut-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(400px, 100%), 1fr));
        gap: 8px;
      }
      .ut-list.machines {
        grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr));
      }
      .ut-card .rut-tools {
        margin-bottom: 10px;
      }
      .ut-rank-change {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-4);
        font-size: 11px;
        white-space: nowrap;
      }
      .ut-rank-change[hidden] {
        display: none;
      }
      .ut-rank-change .btn {
        --ctl-h: 28px;
        padding: 0 8px;
        border-color: color-mix(in srgb, var(--action) 28%, var(--line));
        color: var(--action);
        font-size: 11px;
      }
      .ut-card .ut-more {
        margin-top: 4px;
      }
      .ut-row {
        position: relative;
        display: grid;
        grid-template-columns: 28px minmax(118px, 0.75fr) minmax(96px, 1fr) 104px;
        align-items: center;
        column-gap: 12px;
        padding: 10px 14px 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--ut-cell);
      }
      .ut-list.machines .ut-row {
        grid-template-columns: 28px minmax(150px, 1.3fr) minmax(96px, 0.7fr) 104px;
      }
      /* 空闲：名称、身份牌与走势一起降档，只留读数栏里的合计照常 */
      .ut-row.idle .rut-spark,
      .ut-mult.idle .ut-chart,
      .ut-solo.idle .ut-chart {
        opacity: 0.4;
      }
      .ut-row .rut-who {
        margin-left: -2px;
      }
      .ut-row.idle .rut-name {
        color: var(--ink-3);
      }
      .ut-row.idle :is(.user-avatar, .nd-idplate) {
        opacity: 0.55;
      }
      .ut-row.offline .rut-cur > span {
        color: var(--ink-4);
      }
      .ut-row.found {
        animation: ut-found 1.6s ease-out;
      }
      @keyframes ut-found {
        from {
          background: color-mix(in srgb, var(--action) 14%, var(--card));
        }
      }
      .ut-flag {
        display: grid !important;
        place-items: center;
        color: var(--ink-3);
        font: 600 9px var(--mono);
        letter-spacing: 0.02em;
      }
      .ut-more {
        display: flex;
        gap: 4px;
      }

      /* ── 2–3 位：并排小倍图，纵轴统一，谁大谁小直接可比 ── */
      .ut-multiples {
        display: grid;
        min-width: 0;
        grid-template-columns: repeat(var(--n), minmax(0, 1fr));
      }
      .ut-mult {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 12px;
        padding: 16px 18px 12px;
      }
      .ut-mult + .ut-mult {
        border-left: 1px solid var(--line-soft);
      }
      .ut-mult.idle .rut-name {
        color: var(--ink-3);
      }
      .ut-mult.idle .user-avatar {
        opacity: 0.55;
      }
      .ut-mult-id {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 10px;
      }
      .ut-mult-now {
        display: flex;
        min-height: 22px;
        align-items: baseline;
        gap: 14px;
        color: var(--ink-4);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .ut-mult-now > span {
        display: inline-flex;
        align-items: center;
      }
      .ut-mult-now .d {
        color: var(--ink);
        font: 500 17px var(--sans);
      }
      .ut-mult-now .u {
        color: var(--ink-3);
        font-size: 12.5px;
      }
      .ut-mult-now small {
        margin-left: 3px;
        color: var(--ink-4);
        font-size: 11px;
        font-weight: 400;
      }
      .ut-mult-now .d .rut-dir,
      .ut-mult-now .u .rut-dir {
        margin-right: 4px;
      }
      .ut-mult-now .u .rut-dir {
        color: var(--observe-2);
      }

      /* ── 走势图：单人主图、用户详情合计图、小倍图共用。缺失的窗口断开并铺一层浅底，
         不画成 0；悬停时竖线找时刻，提示框列出该时刻的下行与上行。 */
      .ut-solo {
        display: grid;
        min-width: 0;
        grid-template-rows: auto auto;
        align-content: start;
        gap: 10px;
        padding: 14px 16px 10px 18px;
      }
      .ut-chart {
        position: relative;
        min-width: 0;
      }
      .ut-chart.big {
        padding-left: 38px;
      }
      .ut-plot {
        position: relative;
        cursor: crosshair;
      }
      .ut-plot svg {
        position: absolute;
        display: block;
        overflow: visible;
        width: 100%;
        height: 100%;
        inset: 0;
      }
      .ut-gl {
        position: absolute;
        right: 0;
        left: 0;
        height: 1px;
        background: var(--line-soft);
      }
      .ut-gl.zero {
        background: var(--line);
      }
      .ut-gl > span {
        position: absolute;
        top: -7px;
        left: -38px;
        width: 32px;
        color: var(--ink-4);
        font: 10px/14px var(--mono);
        text-align: right;
      }
      /* 未采集：斜纹铺在不透明卡面上，盖住下面的零刻度线，缺口里不出现「0」 */
      .ut-gap {
        position: absolute;
        top: 0;
        bottom: 0;
        background:
          repeating-linear-gradient(
            135deg,
            transparent 0 3px,
            color-mix(in srgb, var(--ink-4) 18%, transparent) 3px 4px
          ),
          var(--card);
      }
      .ut-area {
        fill: color-mix(in srgb, var(--observe-1) 16%, transparent);
      }
      .ut-line-d {
        fill: none;
        stroke: var(--observe-1);
        stroke-width: 1.6;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .ut-line-u {
        fill: none;
        stroke: var(--observe-2);
        stroke-width: 1.2;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .ut-x {
        position: relative;
        height: 14px;
        margin-top: 6px;
        color: var(--ink-4);
        font: 10px/14px var(--mono);
      }
      .ut-x > span {
        position: absolute;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .ut-x > span.start {
        transform: none;
      }
      .ut-x > span.end {
        transform: translateX(-100%);
      }
      .ut-scale {
        position: absolute;
        z-index: 1;
        top: -15px;
        right: 0;
        color: var(--ink-4);
        font: 10px/14px var(--mono);
      }
      .ut-cross {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--ink-4);
        pointer-events: none;
      }
      .ut-tip {
        position: absolute;
        z-index: 3;
        top: 4px;
        display: grid;
        min-width: 132px;
        gap: 4px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--float-sheet);
        box-shadow: var(--shadow), var(--float-edge);
        backdrop-filter: var(--float-filter);
        color: var(--ink-3);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        white-space: nowrap;
      }
      .ut-tip[hidden],
      .ut-cross[hidden] {
        display: none;
      }
      .ut-tip > div {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .ut-tip b {
        margin-left: auto;
        padding-left: 12px;
        color: var(--ink);
        font-weight: 500;
      }
      .ut-tip i {
        width: 10px;
        height: 2px;
        border-radius: 1px;
      }
      .ut-tip i.d {
        background: var(--observe-1);
      }
      .ut-tip i.u {
        background: var(--observe-2);
      }
      .ut-tip .t {
        color: var(--ink-4);
        font: 10px var(--mono);
      }
      .ut-hour .ut-chart {
        margin-top: 2px;
      }

      /* ── 0 位：不画读数栏，整卡收成一行说明 ── */
      .ut-empty {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
        margin: 0;
        padding: 16px 16px 15px;
        color: var(--ink-2);
        font-size: 12.5px;
      }
      .ut-empty small {
        color: var(--ink-4);
        font-size: 11.5px;
      }

      /* 中宽卡的主区扣掉读数栏后不足以同时容纳搜索、变化提示、图例和排序，
         排序独占下一行；长图例在这一档收起，方向色标仍保留。 */
      @container rut (max-width: 980px) {
        .ut-card .rut-tools {
          flex-wrap: wrap;
        }
        .ut-card .rut-tools .rut-sort {
          display: flex;
          flex: 1 1 100%;
          margin-left: 0;
        }
        .ut-card .rut-tools .rut-sort button {
          flex: 1;
        }
        .ut-card .rut-legend-note {
          display: none;
        }
      }

      /* 窄卡：读数栏堆到上方（styles.css 已处理），新增部分随之收成一列 */
      @container rut (max-width: 700px) {
        .ut-row,
        .ut-list.machines .ut-row {
          grid-template-columns: 28px minmax(0, 1fr) 48px 92px;
          column-gap: 8px;
          padding: 9px 10px;
        }
        .ut-multiples {
          grid-template-columns: minmax(0, 1fr);
        }
        .ut-mult {
          padding: 14px 14px 10px;
        }
        .ut-mult + .ut-mult {
          border-top: 1px solid var(--line-soft);
          border-left: 0;
        }
        .ut-solo {
          padding: 14px 12px 8px 14px;
        }
      }
    </style>
  </head>
  <body>
    <header class="mk-bar">
      <div class="mk-bar-row">
        <div class="mk-title">实时流量 · 改版 <small>MOCKUP · 合成数据</small></div>
        <div class="mk-controls" id="mk-controls"></div>
      </div>
      <p class="mk-note" id="mk-note"></p>
    </header>
    <main class="mk-stage">
      <div class="mk-sheet" id="mk-sheet"><div id="card-slot"></div></div>
    </main>
    <script>
      (() => {
        'use strict';

        /* ═══ 场景参数（地址栏同步，方便截图） ═══ */
        const params = new URLSearchParams(location.search);
        const pick = (key, options, fallback) => (options.includes(params.get(key)) ? params.get(key) : fallback);
        const view = {
          page: pick('page', ['node', 'user'], 'node'),
          n: Number(pick('n', ['0', '1', '3', '12', '48', '320', '2048'], '48')),
          m: Number(pick('m', ['1', '4', '9'], '4')),
          phase: pick('phase', ['ready', 'pending', 'stale', 'unsupported'], 'ready'),
          w: pick('w', ['1120', '860', '390'], '1120'),
          theme: pick('theme', ['dark', 'light'], 'dark'),
          running: params.get('run') !== '0',
        };

        const SLOTS = 120;
        const SLOT_SECS = 30;
        /* 约 25 分钟前 Agent 重启，三个窗口未采集：所有行在同一处断开。 */
        const GAP = [67, 68, 69];
        const IDLE_MILLIS = 10_000;
        const MORE_STEP = 60;
        const SCOPE_NOTE = '统计入口 Xray 的接入与转发；中继不提供最终用户身份';
        const PHASE_TEXT = {
          ready: '实时 · 每秒更新',
          pending: '正在建立速率基线',
          stale: '实时通道未连接',
          unsupported: '当前 Agent 尚未支持用户速率',
        };
        const NOW0 = Date.UTC(2026, 9, 18, 1, 12, 41); // 09:12:41（UTC+8）
        const collator = new Intl.Collator('zh-CN', { numeric: true });

        /* ═══ 数值格式：与 ui/observe-chart.ts、ui/format.ts 相同 ═══ */
        const BPS_UNITS = [
          [1e9, 'Gbit/s'],
          [1e6, 'Mbit/s'],
          [1e3, 'Kbit/s'],
          [1, 'bit/s'],
        ];
        const bpsRung = value => BPS_UNITS.find(([step]) => value / step >= 1) ?? BPS_UNITS[BPS_UNITS.length - 1];
        function significant(scaled) {
          const magnitude = Math.abs(scaled);
          if (magnitude === 0) return '0.00';
          const decimals = Math.max(0, 2 - Math.floor(Math.log10(magnitude)));
          return scaled.toFixed(Math.min(decimals, 6));
        }
        function bpsParts(value, reference = value) {
          const safe = Number.isFinite(value) && value > 0 ? value : 0;
          const ref = Number.isFinite(reference) && reference > 0 ? reference : safe;
          const [divisor, unit] = bpsRung(ref);
          return { number: significant(safe / divisor), unit };
        }
        const KiB = 1024;
        const MiB = KiB * 1024;
        const GiB = MiB * 1024;
        const TiB = GiB * 1024;
        const bytes = n =>
          n >= TiB
            ? `${(n / TiB).toFixed(2)} TiB`
            : n >= GiB
              ? `${(n / GiB).toFixed(2)} GiB`
              : n >= MiB

                : n >= KiB

        const shareOf = (part, whole) => (whole > 0 ? `${((part / whole) * 100).toFixed(1)}%` : '—');
        const clock = (ms, seconds = true) =>

        /* ═══ 图标与身份牌：路径取自 ui/icons.tsx，散列取自 ui/user-avatar.tsx ═══ */
        const ICONS = {

        function avatarHue(id) {
          let hash = 0x811c9dc5;

          `<span class="nd-idplate" aria-hidden="true"><span class="nd-idplate-clip ut-flag">${esc(country)}</span></span>`;

        /* ═══ 走势路径：移植自 ui/sparkline.ts（单调三次曲线，null 断开），改了一处：
           空闲（采集到的 0）不再留空，曲线落到 0 继续画；只有未采集的窗口才断开，不把缺失画成 0。 ═══ */
        const sign = v => (v > 0 ? 1 : v < 0 ? -1 : 0);
        function tangents(ys) {
          const slope = ys.slice(1).map((y, i) => y - ys[i]);
          return ys.map((_, i) => {
            if (slope.length === 0) return 0;
            if (i === 0) return slope[0];
            if (i === ys.length - 1) return slope[i - 1];
            const before = slope[i - 1];
            const after = slope[i];
            return (
              (sign(before) + sign(after)) * Math.min(Math.abs(before), Math.abs(after), Math.abs(before + after) / 4)
            );
          });
        }
        const fx = v => v.toFixed(2);
        function sparklinePaths(values, scale, height, top = 2.5) {
          const zero = height - 0.5;
          const safeScale = scale > 0 ? scale : 1;
          const y = v => zero - Math.min(1, Math.max(0, v) / safeScale) * (zero - top);
          const segments = [];
          let current = null;
          values.forEach((value, index) => {
            if (value === null || !Number.isFinite(value)) {
              current = null;
              return;
            }
            if (!current) {
              current = { start: index, ys: [] };
              segments.push(current);
            }
            current.ys.push(y(value));
          });
          const areas = [];
          const lines = [];
          for (const { start, ys } of segments) {
            const end = start + ys.length - 1;
            const m = tangents(ys);
            const to = i =>
              `C${fx(start + i - 2 / 3)} ${fx(ys[i - 1] + m[i - 1] / 3)} ${fx(start + i - 1 / 3)} ${fx(ys[i] - m[i] / 3)} ${start + i} ${fx(ys[i])}`;
            let curve = `M${start} ${fx(ys[0])}`;
            for (let i = 1; i < ys.length; i += 1) curve += to(i);
            areas.push(`${curve}L${end} ${zero}L${start} ${zero}Z`);
            // 整段采集窗口是一条连续的线：有流量时起伏，空闲时贴着 0 走
            lines.push(curve);
          }
          return { areas, lines };
        }

        /* ═══ 合成数据（固定种子，同一场景每次相同） ═══ */
        function mulberry32(seed) {
          let a = seed;
          return () => {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        let rnd = mulberry32(1);
        const gauss = () => {
          let u = 0;
          let v = 0;
          while (u === 0) u = rnd();
          while (v === 0) v = rnd();
          return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
        };
        const HANDLES = [
          'alice',
          'backup-sync',
          'chen.wei',
          'bob',
          'li.na',
          'media-box',
          'carol',
          'wang.fang',
          'dave',
          'nas-home',
          'erin',
          'zhao.lei',
          'frank',
          'sun.mei',
          'grace',
          'studio-01',
          'heidi',
          'zhou.jie',
          'ivan',
          'lab-gpu',
          'judy',
          'wu.hao',
          'kai',
          'travel-ipad',
          'lena',
          'xu.lin',
          'mika',
          'office-hk',
          'nora',
          'hu.jun',
          'oscar',
          'guest-07',
          'peggy',
          'tv-living',
          'quinn',
          'liu.yang',
          'rosa',
          'ops-bot',
          'sam',
          'tara',
          'uma',
          'vic',
          'wren',
          'xia',
          'yuki',
          'zane',
        ];
        const userName = index =>
          index < HANDLES.length ? HANDLES[index] : `u${String(1000 + ((index * 7919) % 9000)).padStart(4, '0')}`;

        /** 近 1 小时窗口：每格是 30 秒窗口的字节数（与 hourModel 同形），null 是未采集。 */
        function makeHistory(u) {
          const down = new Array(SLOTS).fill(0);
          const up = new Array(SLOTS).fill(0);
          const sessions = [];
          if (u.sessionStart !== undefined) sessions.push([u.sessionStart, SLOTS]);
          else if (u.active) sessions.push([SLOTS - Math.round(12 + rnd() * 100), SLOTS]);
          else {
            const end = SLOTS - Math.max(2, Math.round(u.idleMin * 2));
            sessions.push([Math.max(0, end - Math.round(10 + rnd() * 50)), end]);
          }
          if (rnd() < 0.55) {
            const start = Math.floor(rnd() * 60);
            sessions.push([start, start + Math.round(4 + rnd() * 22)]);
          }
          let level = 0;
          for (let t = 0; t < SLOTS; t += 1) {
            level = level * 0.86 + gauss() * 0.34;
            const on = sessions.some(([a, b]) => t >= a && t < b);
            const d = on ? u.base * SLOT_SECS * Math.exp(level) : 0;
            down[t] = d;
            up[t] = d * u.upRatio * Math.exp(gauss() * 0.15);
          }
          for (const t of GAP) {
            down[t] = null;
            up[t] = null;
          }
          return { down, up };
        }

        function finish(u) {
          u.hour = makeHistory(u);
          u.hourBytes = [...u.hour.down, ...u.hour.up].reduce((sum, v) => sum + (v ?? 0), 0);
          u.level = 0;
          u.down = u.active ? u.base : 0;
          u.up = u.active ? u.base * u.upRatio : 0;
          u.lastActiveMs = u.active ? NOW0 : NOW0 - u.idleMin * 60_000;
          return u;
        }

        function makeUsers(n) {
          if (n <= 3) {
            const preset = [
              { name: 'alice', base: 9.6e6, upRatio: 0.03, active: true, sessionStart: 4 },
              { name: 'backup-sync', base: 0.42e6, upRatio: 3.6, active: true },
              { name: 'chen.wei', base: 2.4e6, upRatio: 0.05, active: false, idleMin: 6.4, forwarding: true },
            ];
            return preset
              .slice(0, n)
              .map((p, index) => finish({ key: `acme/${p.name}`, index, idleMin: 0, forwarding: false, ...p }));
          }
          const activeFrac = Math.min(0.8, 1.35 / Math.sqrt(n) + 0.05);
          const list = Array.from({ length: n }, (_, index) => ({
            key: `acme/${userName(index)}`,
            name: userName(index),
            index,
            weight: Math.pow(1 - rnd() * 0.997, -1 / 1.15),
          }));
          const ranked = [...list].sort((a, b) => b.weight - a.weight);
          const top = ranked[0].weight;
          ranked.forEach((u, rank) => {
            u.base = Math.max(5e3, (12.4e6 * u.weight) / top);
            u.upRatio = u.name === 'backup-sync' ? 3.2 : 0.015 + rnd() * 0.06;
            u.active = rank < 2 || rnd() < activeFrac * (0.5 + 0.9 * (1 - rank / n));
            u.idleMin = 1 + rnd() * 52;
            u.forwarding = rnd() < 0.14;
          });
          return list.map(finish);
        }

        const MACHINES = [
          ['hk-example-01', '香港示例 01', 'HK'],
          ['jp-ntt', '日本 NTT', 'JP'],
          ['sg-01', '新加坡 SG', 'SG'],
          ['tw-home', '台湾住宅入口', 'TW'],
          ['us-west', '美国西部', 'US'],
          ['de-fra', '德国法兰克福', 'DE'],
          ['hk-example-02', '香港示例 02', 'HK'],
          ['au-syd', '澳洲悉尼', 'AU'],
          ['kr-sel', '韩国首尔', 'KR'],
        ];
        function makeMachines(m) {
          return MACHINES.slice(0, m).map(([key, name, country], index) =>
            finish({
              key,
              name,
              country,
              index,
              base: [6.2e6, 0.3e6, 0.9e6, 0.2e6, 1.4e6, 0.5e6, 0.7e6, 0.25e6, 0.4e6][index],
              upRatio: 0.02 + rnd() * 0.05,
              active: index === 0 || index === 2 || index === 4 || index === 7,
              idleMin: 3 + rnd() * 40,
              forwarding: index === 2,
              offline: m >= 4 && index === 3,
              ingresses: 1 + (index % 3),
              lagMs: index === 4 ? 4_000 : 0,
            }),
          );
        }

        /* ═══ 运行状态 ═══ */
        let now = NOW0;
        let users = [];
        let byKey = new Map();
        let byName = [];
        let tier = 'list';
        let sort = 'name';
        let order = { keys: [], at: Number.NEGATIVE_INFINITY, sort: 'name' };
        let query = '';
        let fold = Infinity;
        let expanded = 0;
        let hotIndex = -1;
        let staleSince = null;
        let refs = {};
        let rowEls = new Map();
        let peak = 0;
        let maxTotal = 0;
        let maxHour = 0;
        let timer = null;
        const plots = new Map();

        const tierOf = count =>
          count === 0 ? 'empty' : count === 1 ? 'solo' : count <= 3 ? 'few' : count <= 24 ? 'list' : 'crowd';
        const unit = () => (view.page === 'node' ? '位' : '台');

        /** 当前读数。null 是给不出：未就绪、Agent 不支持、机器未连接。 */
        function reading(u) {
          if (view.phase === 'pending' || view.phase === 'unsupported' || u.offline) return { down: null, up: null };
          return { down: u.down, up: u.up };
        }
        const totalOf = u => {
          const r = reading(u);
          return r.down === null ? 0 : r.down + r.up;
        };
        const isIdle = u => {
          const r = reading(u);
          return (
            view.phase === 'ready' && r.down !== null && r.down + r.up === 0 && now - u.lastActiveMs >= IDLE_MILLIS
          );
        };

        /** 每秒一步：活跃者的速率在对数空间随机游走并偶有突发；少量用户在空闲与活跃之间切换。 */
        function step() {
          now += 1000;
          if (view.phase !== 'ready') return;
          const churn = users.length > 3;
          for (const u of users) {
            if (u.offline) continue;
            if (u.active) {
              u.level = u.level * 0.9 + gauss() * 0.2;
              if (rnd() < 0.008) u.level += 1.1;
              u.down = u.base * Math.exp(u.level);
              u.up = u.down * u.upRatio * Math.exp(gauss() * 0.18);
              u.lastActiveMs = now;
              if (churn && rnd() < 1 / 420) {
                u.active = false;
                u.down = 0;
                u.up = 0;
              }
            } else if (churn && rnd() < 1 / 1600) {
              u.active = true;
              u.level = -0.6;
            }
          }
        }

        /* ═══ 排序：与 compareRows / nextListOrder 相同的规则 ═══ */
        function compareRows(by) {
          return (a, b) => {
            const byNameOrder = collator.compare(a.name, b.name) || a.key.localeCompare(b.key);
            if (by === 'name') return byNameOrder;
            if (by === 'hour') return b.hourBytes - a.hourBytes || byNameOrder;
            const ra = reading(a);
            const rb = reading(b);
            const known = Number(rb.down !== null) - Number(ra.down !== null);
            if (known) return known;
            const recent = b.lastActiveMs - a.lastActiveMs;
            if (by === 'now') return totalOf(b) - totalOf(a) || recent || byNameOrder;
            if (by === 'up')
              return (rb.up ?? 0) - (ra.up ?? 0) || (rb.down ?? 0) - (ra.down ?? 0) || recent || byNameOrder;
            return (rb.down ?? 0) - (ra.down ?? 0) || (rb.up ?? 0) - (ra.up ?? 0) || recent || byNameOrder;
          };
        }
        /** 只在首次建立顺序、切换排序或用户确认时重排；实时读数变化不会自己移动卡片。 */
        function nextOrder(force) {
          if (!force && order.sort === sort && order.keys.length > 0) return false;
          const keys = [...users].sort(compareRows(sort)).map(u => u.key);
          const changed = keys.join('\n') !== order.keys.join('\n');
          order = { keys, at: now, sort };
          return changed;
        }

        function visibleKeys(keys) {
          const needle = query.trim().toLowerCase();
          const matched = needle ? keys.filter(key => byKey.get(key).name.toLowerCase().includes(needle)) : keys;
          return matched.slice(0, needle ? MORE_STEP : fold + expanded);
        }

        /** 折叠区之外的细微互换不打扰用户；可见排名或成员改变时才请求确认。 */
        function visibleRankChanged() {
          if (sort === 'name' || order.keys.length === 0) return false;
          const latest = [...users].sort(compareRows(sort)).map(u => u.key);
          const shown = visibleKeys(order.keys);
          const next = visibleKeys(latest);
          return shown.length !== next.length || shown.some((key, index) => key !== next[index]);
        }

        function updateRankChange() {
          if (refs.rankChange) refs.rankChange.hidden = !visibleRankChanged();
        }

        /* ═══ 图表 ═══ */
        function niceAxis(peakBits) {
          const [divisor, unitName] = bpsRung(Math.max(1, peakBits));
          const raw = Math.max(1e-9, peakBits / divisor / 3);
          const magnitude = Math.pow(10, Math.floor(Math.log10(raw)));
          const stepValue = [1, 2, 2.5, 5, 10].map(s => s * magnitude).find(s => s >= raw) ?? 10 * magnitude;
          const topValue = Math.max(stepValue, Math.ceil(peakBits / divisor / stepValue) * stepValue);
          const ticks = [];
          for (let v = 0; v <= topValue + stepValue / 1000; v += stepValue) ticks.push(v * divisor);
          return { max: topValue * divisor, ticks, unit: unitName, divisor, step: stepValue };
        }
        const tickText = (value, axis) => {
          const scaled = value / axis.divisor;
          return axis.step < 1
            ? scaled.toFixed(Math.min(2, Math.ceil(-Math.log10(axis.step))))
            : String(Math.round(scaled));
        };
        const toBits = values => values.map(v => (v === null ? null : (v * 8) / SLOT_SECS));
        const rangeEnd = () => Math.floor(NOW0 / 30_000) * 30_000;
        const slotEnd = index => rangeEnd() - (SLOTS - 1 - index) * 30_000;

        /** 走势图：plot 是绝对定位的 SVG（viewBox 横向按格、纵向按像素），网格与刻度是 HTML。 */
        function chartHTML(down, up, { height, axis, gridLabels, xLabels, scaleLabel }) {
          const rx = toBits(down);
          const tx = toBits(up);
          const d = sparklinePaths(rx, axis.max, height, 0);
          const u = sparklinePaths(tx, axis.max, height, 0);
          const width = rx.length - 1;
          const grid = gridLabels
            ? axis.ticks
                .map(
                  v =>
                    `<i class="ut-gl${v === 0 ? ' zero' : ''}" style="bottom:${((v / axis.max) * 100).toFixed(3)}%"><span>${tickText(v, axis)}</span></i>`,
                )
                .join('')
            : '';
          const gaps = [];
          rx.forEach((v, i) => {
            if (v !== null) return;
            const last = gaps.at(-1);
            if (last && last[1] === i - 1) last[1] = i;
            else gaps.push([i, i]);
          });
          const gapHTML = gaps
            .map(([a, b]) => {
              const left = (Math.max(0, a - 0.5) / width) * 100;
              const right = (Math.min(width, b + 0.5) / width) * 100;
              return `<i class="ut-gap" style="left:${left.toFixed(2)}%;width:${(right - left).toFixed(2)}%" title="未采集"></i>`;
            })
            .join('');
          const id = `p${Math.random().toString(36).slice(2, 8)}`;
          plots.set(id, { rx, tx, axis });
          const xs = xLabels
            .map(
              ({ at, text, cls }) =>
                `<span class="${cls ?? ''}" style="left:${((at / width) * 100).toFixed(2)}%">${text}</span>`,
            )
            .join('');
          return `<div class="ut-plot" data-plot="${id}" style="height:${height}px">${grid}${gapHTML}
            ${scaleLabel ? `<span class="ut-scale">${scaleLabel}</span>` : ''}
            <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">
              ${d.areas.map(p => `<path class="ut-area" d="${p}"/>`).join('')}
              ${u.lines.map(p => `<path class="ut-line-u" d="${p}"/>`).join('')}
              ${d.lines.map(p => `<path class="ut-line-d" d="${p}"/>`).join('')}
            </svg>
            <i class="ut-cross" hidden></i><div class="ut-tip" hidden></div>
          </div><div class="ut-x">${xs}</div>`;
        }
        /** 刻度落在整刻钟上，两端写起点时刻与「现在」。 */
        function quarterLabels() {
          const labels = [];
          for (let i = 0; i < SLOTS; i += 1) {
            const t = slotEnd(i);
            if (t % 900_000 === 0 && i > 8 && i < SLOTS - 10) labels.push({ at: i, text: clock(t, false) });
          }
          return [
            { at: 0, text: clock(slotEnd(0), false), cls: 'start' },
            ...labels,
            { at: SLOTS - 1, text: '现在', cls: 'end' },
          ];
        }
        const ends = () => [
          { at: 0, text: clock(slotEnd(0), false), cls: 'start' },
          { at: (SLOTS - 1) / 2, text: clock(slotEnd(Math.round((SLOTS - 1) / 2)), false) },
          { at: SLOTS - 1, text: '现在', cls: 'end' },
        ];

        /** 每行的近 1 小时走势：HourSpark 的缩放（本行峰值，下限为全体峰值的 6%）。 */
        function sparkHTML(hour) {
          const perSecond = values => values.map(v => (v === null ? null : v / SLOT_SECS));
          const down = perSecond(hour.down);
          const up = perSecond(hour.up);
          const own = Math.max(0, ...down.map(v => v ?? 0), ...up.map(v => v ?? 0));
          const scale = Math.max(own, peak * 0.06, 1024) * 1.06;
          const d = sparklinePaths(down, scale, 30);
          const u = sparklinePaths(up, scale, 30);
          return `<svg class="rut-spark" viewBox="0 0 ${down.length - 1} 30" preserveAspectRatio="none" aria-hidden="true">${d.areas
            .map(p => `<path class="rut-spark-area" d="${p}"/>`)
            .join('')}${u.lines
            .map(p => `<path class="rut-spark-up" d="${p}"/>`)
            .join('')}${d.lines.map(p => `<path class="rut-spark-line" d="${p}"/>`).join('')}</svg>`;
        }

        /* ═══ 卡片结构 ═══ */
        function noticeHTML() {
          if (view.phase !== 'stale') return '';
          return `<p class="rut-notice" role="status"><i class="node-lamp warn"></i>实时通道未连接：当前速率停在 ${clock(staleSince)}，近 1 小时仍每 30 秒更新</p>`;
        }

        function ledgerHTML() {
          const solo = tier === 'solo' ? users[0] : null;
          return `<section class="rut-now" aria-label="当前速率" data-ref="ledger">
            ${
              solo
                ? `<div class="ut-id">${avatar(solo.name)}<span class="rut-who"><b class="rut-name">${esc(solo.name)}</b>${solo.forwarding ? '<span class="rut-meta">含转发</span>' : ''}</span></div>`
                : ''
            }
            <div class="user-usage-hero">
              <span class="user-usage-hero-label" data-ref="heroLabel"></span>
              <strong class="user-usage-hero-value" data-ref="hero"></strong>
              <span class="rut-hero-sub" data-ref="heroSub"></span>
            </div>
            <div>
              <div class="usage-split" aria-hidden="true" data-ref="split"></div>
              <dl class="usage-io">
                <div class="down"><dt><i aria-hidden="true"></i>下行</dt><dd data-ref="ioDown"></dd><dd class="usage-share" data-ref="shDown"></dd></div>
                <div class="up"><dt><i aria-hidden="true"></i>上行</dt><dd data-ref="ioUp"></dd><dd class="usage-share" data-ref="shUp"></dd></div>
              </dl>
            </div>
            ${
              tier === 'list' || tier === 'crowd'
                ? '<dl class="ut-facts"><div><dt data-ref="topLabel"></dt><dd data-ref="top"></dd></div></dl>'
                : ''
            }
            ${tier === 'crowd' ? crowdHTML() : ''}
          </section>`;
        }

        function crowdHTML() {
          const n = users.length;
          const pitch = n <= 60 ? 16 : n <= 160 ? 12 : n <= 420 ? 10 : n <= 1100 ? 7 : 5;
          const dense = pitch <= 7 ? ' dense' : '';
          const dots = byName.map((_, i) => `<i class="ut-dot" data-i="${i}"></i>`).join('');
          return `<section class="ut-crowd" aria-label="全部用户分布">
            <div class="ut-crowd-head"><span>全部 <b>${n}</b> 位 · 按名称</span></div>
            <div class="ut-map${dense}" data-ref="map" style="--pitch:${pitch}px" aria-hidden="true">${dots}</div>
            <div class="ut-key${dense}" aria-hidden="true"><span class="ut-key-ramp"><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i></span>当前速率<span class="ut-key-idle"></span>空闲</div>
            <p class="ut-readout" data-ref="readout"></p>
          </section>`;
        }

        function soloHTML() {
          const u = users[0];
          const peakBits = Math.max(...toBits(u.hour.down).map(v => v ?? 0), ...toBits(u.hour.up).map(v => v ?? 0));
          const axis = niceAxis(peakBits);
          // 近 1 小时用量已写在读数栏，图头不再重复
          return `<section class="ut-solo" aria-label="近 1 小时">
            ${noticeHTML()}
            <div class="rut-hour-head">
              <span title="按真实采样窗口计算平均速率；未采集的窗口断开">近 1 小时 · 每 30 秒</span>
              <span class="chart-unit">(${axis.unit})</span>
              <span class="rut-legend" aria-hidden="true"><i class="d"></i>下行<i class="u"></i>上行</span>
            </div>
            <div class="ut-chart big">${chartHTML(u.hour.down, u.hour.up, { height: 168, axis, gridLabels: true, xLabels: quarterLabels() })}</div>
          </section>`;
        }

        function multiplesHTML() {
          const peakBits = Math.max(
            ...users.flatMap(u => [...toBits(u.hour.down), ...toBits(u.hour.up)].map(v => v ?? 0)),
          );
          const axis = niceAxis(peakBits);
          const cards = users
            .map(
              (u, i) => `<article class="ut-mult" data-key="${esc(u.key)}" aria-label="${esc(u.name)}">
                <div class="ut-mult-id">${avatar(u.name)}<span class="rut-who"><b class="rut-name">${esc(u.name)}</b><span class="rut-meta" data-ref="meta"></span></span></div>
                <div class="ut-mult-now" data-ref="now"></div>
                <div class="ut-chart">${chartHTML(u.hour.down, u.hour.up, {
                  height: 76,
                  axis,
                  gridLabels: false,
                  xLabels: ends(),
                  scaleLabel: i === 0 ? `同一纵轴 0–${tickText(axis.max, axis)} ${axis.unit}` : '',
                })}</div>
              </article>`,
            )
            .join('');
          return `<div class="ut-multi-wrap">${noticeHTML() ? `<div style="padding:12px 18px 0">${noticeHTML()}</div>` : ''}<div class="ut-multiples" style="--n:${users.length}">${cards}</div></div>`;
        }

        function mainHTML() {
          const machines = view.page === 'user';
          const searchable = machines ? users.length > 6 : users.length > 12;
          const options = machines
            ? [
                ['name', '名称'],
                ['down', '下行'],
                ['up', '上行'],
                ['hour', '近 1 小时'],
              ]
            : tier === 'crowd'
              ? [
                  ['now', '当前'],
                  ['hour', '近 1 小时'],
                  ['name', '名称'],
                ]
              : [
                  ['name', '名称'],
                  ['now', '当前'],
                  ['hour', '近 1 小时'],
                ];
          const what = machines ? '机器' : '用户';
          return `<div class="rut-main">
            <div class="rut-tools" data-ref="tools">
              ${
                searchable
                  ? `<span class="user-list-search">${icon('search', 13, 'user-list-search-icon')}<input type="search" data-ref="search" aria-label="搜索${what}" placeholder="搜索${what}" autocomplete="off" spellcheck="false" /><button type="button" data-act="clear" aria-label="清空搜索" title="清空" hidden>${icon('close', 13)}</button></span>`
                  : ''
              }
              <span class="rut-count" data-ref="count" hidden></span>
              <span class="ut-rank-change" data-ref="rankChange" role="status" aria-live="polite" aria-atomic="true" hidden>
                <span>排名已变化</span><button class="btn sm" type="button" data-act="resort" aria-label="按最新排名重排">重排</button>
              </span>
              <span class="rut-legend" aria-hidden="true"><i class="d"></i>下行<i class="u"></i>上行<span class="rut-legend-note">用量与走势：近 1 小时</span></span>
              <span class="segsw rut-sort" role="group" aria-label="排序">${options
                .map(
                  ([v, label]) =>
                    `<button type="button" data-sort="${v}" aria-pressed="${v === sort}">${label}</button>`,
                )
                .join('')}</span>
            </div>
            ${noticeHTML()}
            <div class="ut-list${machines ? ' machines' : ''}" role="list" aria-label="${machines ? '各入口机器流量' : '各用户流量'}" data-ref="list"></div>
            <p class="rut-empty" data-ref="empty" hidden></p>
            <div class="ut-more" data-ref="more"></div>
          </div>`;
        }

        function hourSectionHTML() {
          const sum = key =>
            Array.from({ length: SLOTS }, (_, i) => {
              const values = users.map(u => u.hour[key][i]);
              return values.every(v => v === null) ? null : values.reduce((s, v) => s + (v ?? 0), 0);
            });
          const down = sum('down');
          const up = sum('up');
          const peakBits = Math.max(...toBits(down).map(v => v ?? 0), ...toBits(up).map(v => v ?? 0));
          const axis = niceAxis(peakBits);
          const total = users.reduce((s, u) => s + u.hourBytes, 0);
          const [figure, unitName] = bytes(total).split(' ');
          return `<section class="rut-hour ut-hour" aria-label="近 1 小时">
            <div class="rut-hour-head">
              <span title="按真实采样窗口计算平均速率；未采集的窗口断开">近 1 小时 · 每 30 秒</span>
              <span class="chart-unit">(${axis.unit})</span>
              <span class="rut-legend" aria-hidden="true"><i class="d"></i>下行<i class="u"></i>上行</span>
              <b>${figure}<small>${unitName}</small></b>
            </div>
            <div class="ut-chart big">${chartHTML(down, up, { height: 150, axis, gridLabels: true, xLabels: quarterLabels() })}</div>
          </section>`;
        }

        function bodyHTML() {
          if (tier === 'empty') {
            return `<p class="ut-empty">${view.page === 'node' ? '近 1 小时没有用户流量' : '尚未授权入口机器'}<small>${SCOPE_NOTE}</small></p>`;
          }
          if (tier === 'machines')
            return `<div class="rut-cockpit">${ledgerHTML()}${hourSectionHTML()}</div>${mainHTML()}`;
          const main = tier === 'solo' ? soloHTML() : tier === 'few' ? multiplesHTML() : mainHTML();
          return `<div class="rut-split">${ledgerHTML()}${main}</div>`;
        }

        function renderCard() {
          const slot = document.getElementById('card-slot');
          const warn = view.phase === 'stale' || view.phase === 'unsupported';
          const lamp = view.phase === 'ready' ? '' : view.phase === 'pending' ? ' idle' : ' warn';
          slot.innerHTML = `<section class="panel config-panel realtime-user-traffic ut-card${view.phase === 'stale' ? ' stale' : ''}${view.page === 'user' ? ' user-dcard' : ''}" aria-label="实时流量" data-ref="card">
            <header class="realtime-panel-header">
              <span title="${SCOPE_NOTE}"><h4 class="panel-title">${icon('usage', 14, 'panel-title-icon')}实时流量</h4></span>
              <span class="rut-status${warn ? ' warn' : ''}" role="status"><i class="node-lamp${lamp}"></i>${PHASE_TEXT[view.phase]}</span>
            </header>
            <div class="rut-body">${bodyHTML()}</div>
          </section>`;
          refs = {};
          for (const el of slot.querySelectorAll('[data-ref]')) {
            if (!el.closest('.ut-mult')) refs[el.dataset.ref] = el;
          }
          refs.dots = refs.map ? [...refs.map.children] : [];
          rowEls = new Map();
          bindCard(slot);
          maxTotal = users.reduce((m, u) => Math.max(m, totalOf(u)), 0);
          if (refs.hero) updateLedger(totals());
          if (refs.map) updateMap();
          // 先按填好的读数栏定折叠行数，再排出列表，避免先铺满全部行再收起
          if (refs.list) {
            computeFold();
            nextOrder(true);
            syncList();
          }
          update();
        }

        /* ═══ 每秒更新 ═══ */
        function computeStatics() {
          peak = 0;
          maxHour = 0;
          for (const u of users) {
            maxHour = Math.max(maxHour, u.hourBytes);
            u.hour.down.forEach((d, i) => {
              const up = u.hour.up[i];
              peak = Math.max(peak, ((d ?? 0) + (up ?? 0)) / SLOT_SECS);
            });
          }
        }

        function totals() {
          let down = 0;
          let up = 0;
          let active = 0;
          let known = 0;
          for (const u of users) {
            const r = reading(u);
            if (r.down === null) continue;
            known += 1;
            down += r.down;
            up += r.up;
            if (r.down + r.up > 0) active += 1;
          }
          return { down, up, active, known };
        }

        function update() {
          const t = totals();
          maxTotal = users.reduce((m, u) => Math.max(m, totalOf(u)), 0);
          if (refs.hero) updateLedger(t);
          if (tier === 'few') updateMultiples();
          if (refs.list) {
            for (const el of refs.list.children) updateRow(el, byKey.get(el.dataset.key));
            updateRankChange();
          }
          if (refs.map) updateMap();
        }

        function updateLedger(t) {
          const live = view.phase === 'ready' || view.phase === 'stale';
          const sum = t.down + t.up;
          const solo = tier === 'solo' ? users[0] : null;
          const stale = view.phase === 'stale';
          refs.heroLabel.textContent = solo
            ? stale
              ? '上次速率'
              : '当前速率'
            : stale
              ? '上次速率合计'
              : '最近速率合计';
          if (live) {
            const p = bpsParts(sum * 8);
            refs.hero.innerHTML = `${sum > 0 ? p.number : '0'} <small>${p.unit}</small>`;
          } else refs.hero.innerHTML = '<span class="rut-wait">—</span>';
          if (solo) {
            const idle = isIdle(solo);
            document.querySelector('.ut-solo')?.classList.toggle('idle', idle);
            refs.heroSub.innerHTML = `近 1 小时 <b>${bytes(solo.hourBytes)}</b>${idle ? ` · ${idleLabel(now - solo.lastActiveMs)}` : ''}`;
          } else if (view.page === 'user') {
            refs.heroSub.innerHTML = live
              ? `<b>${t.active}</b> 台活跃 · ${t.known} / ${users.length} 台有读数`
              : `共 ${users.length} 台`;
          } else {
            refs.heroSub.innerHTML = live
              ? `<b>${t.active}</b> 位活跃 · 共 <b>${users.length}</b> 位`
              : `共 ${users.length} 位`;
          }
          refs.split.innerHTML =
            live && sum > 0
              ? `${t.down > 0 ? `<i class="down" style="flex-grow:${t.down}"></i>` : ''}${t.up > 0 ? `<i class="up" style="flex-grow:${t.up}"></i>` : ''}`
              : '';
          const pair = Math.max(t.down, t.up);
          const rateText = v => {
            if (v === 0) return '0';
            const p = bpsParts(v * 8, pair * 8);
            return `${p.number} ${p.unit}`;
          };
          refs.ioDown.textContent = live ? rateText(t.down) : '—';
          refs.ioUp.textContent = live ? rateText(t.up) : '—';
          refs.shDown.textContent = live && sum > 0 ? shareOf(t.down, sum) : '';
          refs.shUp.textContent = live && sum > 0 ? shareOf(t.up, sum) : '';
          if (refs.top) {
            const k = tier === 'crowd' ? 5 : 3;
            refs.topLabel.textContent = `前 ${k} 位占当前流量`;
            const topSum = users
              .map(totalOf)
              .sort((a, b) => b - a)
              .slice(0, k)
              .reduce((s, v) => s + v, 0);
            refs.top.textContent = live && sum > 0 ? shareOf(topSum, sum) : '—';
          }
        }

        function rateHTML(v, pair) {
          if (v === null) return '—';
          if (v === 0) return '0';
          const p = bpsParts(v * 8, pair * 8);
          return `${p.number}<small>${p.unit}</small>`;
        }

        /** 第二行：用量在前、说明在后，窄格省略时截掉的是说明而不是数字。 */
        function metaHTML(u) {
          const lead = [];
          if (view.page === 'user' && u.ingresses) lead.push(`${u.ingresses} 个接入点`);
          const [figure, unitName] = bytes(u.hourBytes).split(' ');
          const tail = [];
          if (u.forwarding) tail.push('含转发');
          if (u.offline) tail.push('未连接');
          if (view.page === 'user' && !u.offline && u.lagMs >= 3_000)
            tail.push(`${Math.floor(u.lagMs / 1000)} 秒前收到`);
          return `${lead.map(p => `${p} · `).join('')}<em>${figure}</em> ${unitName}${tail
            .map(p => ` · ${p}`)
            .join('')}`;
        }

        function createRow(u) {
          const el = document.createElement('div');
          el.className = 'ut-row';
          el.setAttribute('role', 'listitem');
          el.dataset.key = u.key;
          el.innerHTML = `${view.page === 'node' ? avatar(u.name) : machineMark(u.country)}
            <span class="rut-who"><b class="rut-name">${esc(u.name)}</b><span class="rut-meta"></span></span>
            ${sparkHTML(u.hour)}
            <div class="rut-cur"></div>`;
          el._meta = el.querySelector('.rut-meta');
          el._cur = el.querySelector('.rut-cur');
          if (u.offline) el._meta.classList.add('warn');
          return el;
        }

        function updateRow(el, u) {
          const r = reading(u);
          const idle = isIdle(u);
          const frozen = view.phase === 'stale' || !!u.offline;
          el.classList.toggle('idle', idle);
          el.classList.toggle('offline', !!u.offline);
          const meta = metaHTML(u);
          if (el._meta.innerHTML !== meta) el._meta.innerHTML = meta;
          let cur;
          let curClass = 'rut-cur';
          if (r.down === null || (frozen && r.down + r.up === 0)) {
            curClass += ' none';
            cur = '—';
          } else if (idle) {
            curClass += ' idle';
            cur = idleLabel(now - u.lastActiveMs);
          } else {
            const pair = Math.max(r.down, r.up);
            cur = `<span class="d">${icon('rx', 11, 'rut-dir')}${rateHTML(r.down, pair)}</span><span class="u">${icon('tx', 11, 'rut-dir')}${rateHTML(r.up, pair)}</span>`;
          }
          if (el._cur.className !== curClass) el._cur.className = curClass;
          if (el._cur.innerHTML !== cur) el._cur.innerHTML = cur;
          el.setAttribute(
            'aria-label',
            `${u.name}：${frozen ? '上次' : '当前'}下行 ${r.down === null ? '未知' : `${bytes(r.down)}/s`}，上行 ${
              r.up === null ? '未知' : `${bytes(r.up)}/s`
            }，近 1 小时 ${bytes(u.hourBytes)}`,
          );
        }

        function computeFold() {
          if (tier !== 'crowd') {
            fold = Infinity;
            return;
          }
          const narrow = refs.card.clientWidth <= 700;
          if (narrow) {
            fold = 8;
            return;
          }
          // 列表只展开到与读数栏大致等高，整张卡是一个完整的矩形。读数栏是网格项，会被
          // 长列表拉伸，所以量它最后一个子元素的下沿，而不是它自己的盒高。
          const ledger = refs.ledger;
          const natural =
            ledger.lastElementChild.getBoundingClientRect().bottom -
            ledger.getBoundingClientRect().top +
            parseFloat(getComputedStyle(ledger).paddingBottom);
          // 卡片 56px 高 + 8px 间隙；最小列宽 400px，与 .ut-list 一致
          const columns = Math.max(1, Math.floor((refs.list.clientWidth + 8) / (400 + 8)));
          const available = natural - refs.tools.offsetHeight - 12 - 6 - 40;
          fold = Math.max(4, Math.round(available / 64)) * columns;
        }

        function syncList() {
          const ordered = order.keys.map(k => byKey.get(k)).filter(Boolean);
          const needle = query.trim().toLowerCase();
          const matched = needle ? ordered.filter(u => u.name.toLowerCase().includes(needle)) : ordered;
          const limit = needle ? MORE_STEP : fold + expanded;
          const visible = matched.slice(0, limit);
          const list = refs.list;
          const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
          const before = new Map();
          for (const el of list.children) before.set(el.dataset.key, el.getBoundingClientRect());
          const fragment = document.createDocumentFragment();
          for (const u of visible) {
            let el = rowEls.get(u.key);
            if (!el) {
              el = createRow(u);
              rowEls.set(u.key, el);
            }
            updateRow(el, u);
            fragment.appendChild(el);
          }
          list.replaceChildren(fragment);
          if (!reduce) {
            const moved = [];
            for (const el of list.children) {
              const was = before.get(el.dataset.key);
              if (!was) continue;
              const box = el.getBoundingClientRect();
              const dx = was.left - box.left;
              const dy = was.top - box.top;
              if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
              el.style.transition = 'none';
              el.style.transform = `translate(${dx}px, ${dy}px)`;
              moved.push(el);
            }
            if (moved.length) {
              void list.offsetHeight;
              for (const el of moved) {
                el.style.transition = 'transform 320ms cubic-bezier(.2,.7,.2,1)';
                el.style.transform = '';
              }
            }
          }
          if (refs.count) {
            refs.count.hidden = !needle;
            refs.count.textContent = `${matched.length} / ${ordered.length}`;
          }
          refs.empty.hidden = !(needle && matched.length === 0);
          refs.empty.textContent = `没有匹配「${query.trim()}」的${view.page === 'node' ? '用户' : '机器'}`;
          const rest = matched.length - visible.length;
          const buttons = [];
          if (!needle && rest > 0) {
            buttons.push(
              `<button class="btn text sm rut-more" type="button" data-act="more">${rest > MORE_STEP ? `再显示 ${MORE_STEP} ${unit()}（其余 ${rest} ${unit()}）` : `显示其余 ${rest} ${unit()}`}</button>`,
            );
          }
          if (!needle && expanded > 0)
            buttons.push('<button class="btn text sm rut-more" type="button" data-act="less">收起</button>');
          refs.more.innerHTML = buttons.join('');
          updateRankChange();
        }

        function dotClass(u, i) {
          const r = reading(u);
          const total = r.down === null ? 0 : r.down + r.up;
          let cls = 'ut-dot';
          if (r.down === null) cls += ' unknown';
          else if (total > 0) {
            const f = Math.sqrt(total / maxTotal);
            cls += f > 0.62 ? ' l4' : f > 0.34 ? ' l3' : f > 0.15 ? ' l2' : ' l1';
          } else cls += ' idle';
          const needle = query.trim().toLowerCase();
          if (needle && u.name.toLowerCase().includes(needle)) cls += ' match';
          if (i === hotIndex) cls += ' hot';
          return cls;
        }

        function updateMap() {
          refs.map.classList.toggle('searching', query.trim() !== '');
          byName.forEach((u, i) => {
            const cls = dotClass(u, i);
            const el = refs.dots[i];
            if (el.className !== cls) el.className = cls;
          });
          renderReadout();
        }

        function renderReadout() {
          if (!refs.readout) return;
          const u = byName[hotIndex];
          if (!u) {
            refs.readout.innerHTML = '悬停查看用户，点击在列表中定位';
            return;
          }
          const r = reading(u);
          const idle = isIdle(u);
          const pair = Math.max(r.down ?? 0, r.up ?? 0);
          const now_ =
            r.down === null
              ? '当前读数未知'
              : idle
                ? idleLabel(now - u.lastActiveMs)
                : `<span class="v">↓ ${rateHTML(r.down, pair).replace('<small>', ' ').replace('</small>', '')}</span> · <span class="v">↑ ${rateHTML(r.up, pair).replace('<small>', ' ').replace('</small>', '')}</span>`;
          refs.readout.innerHTML = `<b>${esc(u.name)}</b><br>${now_}<br>近 1 小时 ${bytes(u.hourBytes)}`;
        }

        function updateMultiples() {
          for (const card of document.querySelectorAll('.ut-mult')) {
            const u = byKey.get(card.dataset.key);
            const r = reading(u);
            const idle = isIdle(u);
            card.classList.toggle('idle', idle);
            const meta = card.querySelector('[data-ref=meta]');
            const metaText = `近 1 小时 <em>${bytes(u.hourBytes).split(' ')[0]}</em> ${bytes(u.hourBytes).split(' ')[1]}${u.forwarding ? ' · 含转发' : ''}`;
            if (meta.innerHTML !== metaText) meta.innerHTML = metaText;
            const box = card.querySelector('[data-ref=now]');
            const frozen = view.phase === 'stale';
            let html;
            if (r.down === null || (frozen && r.down + r.up === 0)) html = '<span>—</span>';
            else if (idle) html = `<span>${idleLabel(now - u.lastActiveMs)}</span>`;
            else {
              const pair = Math.max(r.down, r.up);
              html = `<span class="d">${icon('rx', 13, 'rut-dir')}${rateHTML(r.down, pair)}</span><span class="u">${icon('tx', 11, 'rut-dir')}${rateHTML(r.up, pair)}</span>`;
            }
            if (box.innerHTML !== html) box.innerHTML = html;
            box.style.color = frozen ? 'var(--ink-4)' : '';
          }
        }

        /* ═══ 交互 ═══ */
        function bindCard(root) {
          root.addEventListener('click', event => {
            const sortButton = event.target.closest('[data-sort]');
            if (sortButton) {
              sort = sortButton.dataset.sort;
              for (const b of root.querySelectorAll('[data-sort]'))
                b.setAttribute('aria-pressed', String(b === sortButton));
              expanded = 0;
              nextOrder(true);
              syncList();
              update();
              return;
            }
            const act = event.target.closest('[data-act]')?.dataset.act;
            if (act === 'resort') {
              nextOrder(true);
              syncList();
            } else if (act === 'more') {
              expanded += MORE_STEP;
              syncList();
            } else if (act === 'less') {
              expanded = 0;
              syncList();
            } else if (act === 'clear') setQuery('');
          });
          if (refs.search) {
            refs.search.addEventListener('input', () => setQuery(refs.search.value));
            refs.search.addEventListener('keydown', event => {
              if (event.key === 'Escape') setQuery('');
            });
          }
          if (refs.map) {
            refs.map.addEventListener('pointerover', event => {
              const i = Number(event.target.dataset?.i);
              if (!Number.isInteger(i)) return;
              hotIndex = i;
              updateMap();
            });
            refs.map.addEventListener('pointerleave', () => {
              hotIndex = -1;
              updateMap();
            });
            refs.map.addEventListener('click', event => {
              const u = byName[Number(event.target.dataset?.i)];
              if (!u) return;
              setQuery(u.name);
              const el = rowEls.get(u.key);
              if (el) {
                el.classList.remove('found');
                void el.offsetWidth;
                el.classList.add('found');
              }
            });
          }
          for (const plot of root.querySelectorAll('.ut-plot')) bindPlot(plot);
        }

        function setQuery(value) {
          query = value;
          if (refs.search && refs.search.value !== value) refs.search.value = value;
          const clear = refs.search?.parentElement.querySelector('[data-act=clear]');
          if (clear) clear.hidden = value === '';
          syncList();
          if (refs.map) updateMap();
        }

        /** 竖线找时刻：指针落在哪一格就读哪一格，未采集的格写「未采集」，不写 0。 */
        function bindPlot(plot) {
          const data = plots.get(plot.dataset.plot);
          const cross = plot.querySelector('.ut-cross');
          const tip = plot.querySelector('.ut-tip');
          const width = data.rx.length - 1;
          plot.addEventListener('pointermove', event => {
            const box = plot.getBoundingClientRect();
            const f = Math.min(1, Math.max(0, (event.clientX - box.left) / box.width));
            const i = Math.round(f * width);
            const x = (i / width) * box.width;
            cross.hidden = false;
            cross.style.left = `${x}px`;
            const d = data.rx[i];
            const u = data.tx[i];
            const window = `${clock(slotEnd(i) - 30_000)} – ${clock(slotEnd(i))}`;
            const pair = Math.max(d ?? 0, u ?? 0);
            const value = v => {
              if (v === 0) return '0';
              const p = bpsParts(v, pair);
              return `${p.number} ${p.unit}`;
            };
            tip.innerHTML =
              d === null
                ? `<span class="t">${window}</span><div>未采集</div>`
                : `<span class="t">${window}</span><div><i class="d"></i>下行<b>${value(d)}</b></div><div><i class="u"></i>上行<b>${value(u)}</b></div>`;
            tip.hidden = false;
            const tipWidth = tip.offsetWidth;
            tip.style.left = `${x + 12 + tipWidth > box.width ? x - 12 - tipWidth : x + 12}px`;
          });
          plot.addEventListener('pointerleave', () => {
            cross.hidden = true;
            tip.hidden = true;
          });
        }

        /* ═══ 审阅外壳 ═══ */
        const NOTES = {
          empty: ['0 位', '不画读数栏和空列表，整卡收成一行说明；有人出现后再展开。'],
          solo: ['1 位', '读数栏换成这个人的身份与当前速率，右侧放大成近 1 小时走势图——卡片只讲一个人，没有空格子。'],
          few: ['2–3 位', '读数栏仍是合计；右侧并排小倍图，纵轴统一，谁大谁小直接可比，高度与读数栏齐平。'],
          list: [
            '4–24 位',
            '全部列出、默认按名称不跳动；每行是身份、近 1 小时走势与当前下行 / 上行读数；走势在空闲时段贴着 0 继续画，只有未采集才断开。',
          ],
          crowd: [
            '25 位以上',
            '读数栏下加人群点阵：全部用户按名称固定位置（实心深浅 = 当前速率，空心 = 空闲；上千人时收成小方格热图），悬停读数、点击定位；列表默认按当前速率，只展开到与读数栏等高。数字每秒更新，排名变化后点「重排」才移动卡片。',
          ],
          machines: [
            '用户详情',
            '同一套行组件，列的是入口机器；合计走势图保留在读数栏旁，未连接的机器只标记、不计入合计。',
          ],
        };

        function controlsHTML() {
          const seg = (key, label, options, current, hidden = false) =>
            `<div class="mk-ctl"${hidden ? ' hidden' : ''}><span class="mk-ctl-label" id="mk-${key}">${label}</span><span class="segsw" role="group" aria-labelledby="mk-${key}">${options
              .map(
                ([v, text]) =>
                  `<button type="button" data-ctl="${key}" data-v="${v}" aria-pressed="${String(v) === String(current)}">${text}</button>`,
              )
              .join('')}</span></div>`;
          return [
            seg(
              'page',
              '页面',
              [
                ['node', '机器详情'],
                ['user', '用户详情'],
              ],
              view.page,
            ),
            seg(
              'n',
              '人数',
              [0, 1, 3, 12, 48, 320, 2048].map(v => [v, String(v)]),
              view.n,
              view.page !== 'node',
            ),
            seg(
              'm',
              '机器',
              [1, 4, 9].map(v => [v, String(v)]),
              view.m,
              view.page !== 'user',
            ),
            seg(
              'phase',
              '状态',
              [
                ['ready', '实时'],
                ['pending', '建立基线'],
                ['stale', '通道断开'],
                ['unsupported', '未支持'],
              ],
              view.phase,
            ),
            seg(
              'w',
              '宽度',
              [
                ['1120', '宽'],
                ['860', '中'],
                ['390', '手机'],
              ],
              view.w,
            ),
            seg(
              'theme',
              '主题',
              [
                ['dark', '暗'],
                ['light', '亮'],
              ],
              view.theme,
            ),
            `<button class="btn" type="button" data-ctl="run" style="height:28px">${view.running ? '暂停' : '继续'}</button>`,
          ].join('');
        }

        function syncUrl() {
          const next = new URLSearchParams({
            page: view.page,
            n: view.n,
            m: view.m,
            phase: view.phase,
            w: view.w,
            theme: view.theme,
            ...(view.running ? {} : { run: '0' }),
          });
          history.replaceState(null, '', `?${next}`);
        }

        function build() {
          plots.clear();
          rnd = mulberry32(view.page === 'node' ? 17 + view.n : 101 + view.m);
          now = NOW0;
          users = view.page === 'node' ? makeUsers(view.n) : makeMachines(view.m);
          byKey = new Map(users.map(u => [u.key, u]));
          byName = [...users].sort((a, b) => collator.compare(a.name, b.name));
          tier = view.page === 'node' ? tierOf(users.length) : users.length ? 'machines' : 'empty';
          sort = tier === 'crowd' ? 'now' : 'name';
          order = { keys: [], at: Number.NEGATIVE_INFINITY, sort };
          query = '';
          expanded = 0;
          hotIndex = -1;
          staleSince = view.phase === 'stale' ? NOW0 - 27_000 : null;
          computeStatics();
          document.documentElement.dataset.theme = view.theme;
          const sheet = document.getElementById('mk-sheet');
          sheet.style.setProperty('--stage-w', `${view.w}px`);
          sheet.classList.toggle('phone', view.w === '390');
          document.getElementById('mk-controls').innerHTML = controlsHTML();
          const [title, text] = NOTES[tier];
          document.getElementById('mk-note').innerHTML = `<b>${title}</b>${text}`;
          renderCard();
          syncUrl();
          clearInterval(timer);
          if (view.running) {
            timer = setInterval(() => {
              step();
              update();
            }, 1000);
          }
        }

        document.getElementById('mk-controls').addEventListener('click', event => {
          const button = event.target.closest('[data-ctl]');
          if (!button) return;
          const key = button.dataset.ctl;
          if (key === 'run') view.running = !view.running;
          else if (key === 'n' || key === 'm') view[key] = Number(button.dataset.v);
          else view[key] = button.dataset.v;
          build();
        });
        addEventListener('resize', () => {
          if (tier === 'crowd' && refs.list) {
            computeFold();
            syncList();
          }
        });

        build();
      })();
    </script>
  </body>
</html>
